// Calcule le numéro de semaine ISO 8601 à partir d'une date "YYYY-MM-DD"
function getISOWeek(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return "";
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  const week = 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
  return String(week);
}

  };

});

function Select({ value, onChange, options, placeholder="Sélectionner..." }) {

      <option value="">{placeholder}</option>
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  );
}
function Textarea({ value, onChange, placeholder="" }) {
  return <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={s.textarea} />;
}
function RadioPill({ label, selected, onClick }) {

  return <div style={s.radioGroup}>{options.map(o=><RadioPill key={o.value||o} label={o.label||o} selected={value===(o.value||o)} onClick={()=>onChange(o.value||o)} />)}</div>;

Texte: "${text}"`

      });

      }

      const raw = (data.text || "{}").replace(/```json|```/g, "").trim();
      onFill(JSON.parse(raw));
      setStatus({ msg: "✓ Formulaire rempli avec succès !", type: "success" });

    } catch(e) {

  };

  return (
    <div style={s.aiBanner}>

      </div>
      {status.msg && <div style={s.aiFeedback(status.type)}>{status.msg}</div>}

  );
}

// ─── SIGNATURE PAD ───────────────────────────────────────────────────────────
function SignaturePad({ label, value, onChange }) {
  const [open, setOpen] = useState(false);
  const [isEmpty, setIsEmpty] = useState(!value);
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const lastPos = useRef(null);

  // Initialiser le canvas quand la modale s'ouvre
  useEffect(() => {
    if (!open) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (value) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = value;
    }
  }, [open]);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY,
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    drawing.current = true;
    const pos = getPos(e, canvasRef.current);
    lastPos.current = pos;
    const ctx = canvasRef.current.getContext("2d");
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = "#1a3a6e";
    ctx.fill();
    setIsEmpty(false);
  };

  const draw = (e) => {
    e.preventDefault();
    if (!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.beginPath();
    ctx.moveTo(lastPos.current.x, lastPos.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = "#1a3a6e";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    lastPos.current = pos;
  };

  const stopDraw = () => { drawing.current = false; };

  const clear = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    setIsEmpty(true);
  };

  const confirm = () => {
    if (canvasRef.current) {
      const data = isEmpty ? "" : canvasRef.current.toDataURL("image/png");
      onChange(data);
    }
    setOpen(false);
  };

  const cancel = () => setOpen(false);

  return (
    <>
      {/* Aperçu compact — clic pour ouvrir */}
      <div style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <label style={s.label}>{label}</label>
          {value && (
            <button onClick={()=>{onChange(""); setIsEmpty(true);}}
              style={{background:"none",border:"none",color:C.danger,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",padding:"2px 6px"}}>
              ✕ Effacer
            </button>
          )}
        </div>
        <div
          onClick={() => setOpen(true)}
          style={{
            border:`2px solid ${value ? C.blueMid : C.grayLight}`,
            borderRadius:9, background:"#fff", height:72,
            display:"flex", alignItems:"center", justifyContent:"center",
            cursor:"pointer", overflow:"hidden", position:"relative",
          }}
        >
          {value ? (
            <img src={value} style={{width:"100%",height:"100%",objectFit:"contain"}} alt="signature" />
          ) : (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:C.gray}}>
              <span style={{fontSize:22}}>✍</span>
              <span style={{fontSize:11,fontStyle:"italic"}}>Appuyez pour signer</span>
            </div>
          )}
        </div>
      </div>

      {/* Modale plein écran pour signer */}
      {open && (
        <div style={{
          position:"fixed", inset:0, zIndex:600,
          background:"rgba(0,0,0,0.7)",
          display:"flex", flexDirection:"column",
        }}>
          {/* Header modale */}
          <div style={{
            background:C.blue, padding:"14px 16px",
            display:"flex", alignItems:"center", justifyContent:"space-between",
            flexShrink:0,
          }}>
            <div>
              <div style={{color:"#fff",fontWeight:700,fontSize:15}}>{label}</div>
              <div style={{color:"rgba(255,255,255,0.55)",fontSize:11,marginTop:1}}>Signez dans la zone ci-dessous</div>
            </div>
            <button onClick={cancel} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"#fff",padding:"7px 14px",fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer"}}>
              Annuler
            </button>
          </div>

          {/* Zone de signature — occupe tout l'espace disponible */}
          <div style={{flex:1, background:"#f0f4ff", display:"flex", flexDirection:"column", padding:12, gap:10, overflow:"hidden"}}>
            <div style={{
              flex:1, background:"#fff",
              borderRadius:12, border:`2px dashed ${C.blueMid}`,
              position:"relative", overflow:"hidden", touchAction:"none",
            }}>
              {isEmpty && (
                <div style={{
                  position:"absolute", inset:0, pointerEvents:"none",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  flexDirection:"column", gap:8,
                }}>
                  <span style={{fontSize:40, opacity:0.2}}>✍</span>
                  <span style={{fontSize:13, color:C.gray, fontStyle:"italic"}}>Tracez votre signature ici</span>
                </div>
              )}
              <canvas
                ref={canvasRef}
                width={900}
                height={400}
                style={{display:"block", width:"100%", height:"100%", touchAction:"none", cursor:"crosshair"}}
                onMouseDown={startDraw}
                onMouseMove={draw}
                onMouseUp={stopDraw}
                onMouseLeave={stopDraw}
                onTouchStart={startDraw}
                onTouchMove={draw}
                onTouchEnd={stopDraw}
              />
            </div>

            {/* Actions */}
            <div style={{display:"flex", gap:10, flexShrink:0}}>
              <button onClick={clear}
                style={{flex:1, padding:"13px", background:"#fff", border:`1.5px solid ${C.grayLight}`, borderRadius:10, fontFamily:"inherit", fontSize:13, fontWeight:600, cursor:"pointer", color:C.danger}}>
                🗑 Effacer
              </button>
              <button onClick={confirm}
                style={{flex:2, padding:"13px", background:C.blue, border:"none", borderRadius:10, fontFamily:"inherit", fontSize:14, fontWeight:700, cursor:"pointer", color:"#fff"}}>
                ✓ Confirmer la signature
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ─── VUE ARCHIVE ─────────────────────────────────────────────────────────────
function VueArchive({ docs, onDelete, onEdit, onExportPDF }) {
  const [view, setView] = useState("chantiers"); // "chantiers" | "tous"
  const [chantierOuvert, setChantierOuvert] = useState(null); //
  const [confirmDeleteId, setConfirmDeleteId] = useState(null); // id du doc à supprimer
  const [confirmDeleteChantier, setConfirmDeleteChantier] = useState(null); // nom du dossier à supprimer nom du chantier ouvert
  const [filter, setFilter] = useState("tous");
  const [sortAsc, setSortAsc] = useState(false);
  const [showNewChantier, setShowNewChantier] = useState(false);
  const [newChantierNom, setNewChantierNom] = useState("");
  const [showMoveModal, setShowMoveModal] = useState(null); // doc à déplacer
  const [chantiers, setChantiers] = useState(() => {
    try { return JSON.parse(localStorage.getItem("bonna_chantiers") || "[]"); } catch { return []; }
  });

  // Charger les chantiers depuis Supabase
  useEffect(() => {
    // Charger les chantiers depuis Supabase
    if (!supabaseReady()) return;
    sbFetch("/chantiers?order=nom.asc&limit=200")
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        const fromSupabase = rows.map(r => r.nom);
        // Ajouter aussi les noms de chantiers trouvés dans les docs locaux
        const fromDocs = [...new Set(docs.map(d => d.chantier).filter(Boolean))];
        // Merger : Supabase + docs locaux, sans doublon (insensible casse)
        const merged = [...fromSupabase];
        fromDocs.forEach(nom => {
          if (!merged.some(c => (c||"").trim().toLowerCase() === (nom||"").trim().toLowerCase())) {
            merged.push(nom);
          }
        });
        if (merged.length > 0) {
          setChantiers(merged);
          localStorage.setItem("bonna_chantiers", JSON.stringify(merged));
        }
      }).catch(()=>{});
  }, [docs]);

  const saveChantiers = async (list) => {
    setChantiers(list);
    localStorage.setItem("bonna_chantiers", JSON.stringify(list));
    // Sync Supabase — on remplace toute la liste
    if (supabaseReady()) {
      try {
        // Supprimer tous puis réinsérer
        await sbFetch("/chantiers?nom=neq.___", { method: "DELETE", prefer: "return=minimal" });
        if (list.length > 0) {
          await sbFetch("/chantiers", {
            method: "POST", prefer: "return=minimal",
            body: JSON.stringify(list.map(nom => ({ nom })))
          });
        }
      } catch(e) { console.error("Sync chantiers error:", e); }
    }
  };

  const icons  = { securite:"🤿", notice:"📋", accueil:"🛡️" };
  const labels = { securite:"Fiche Sécurité", notice:"Notice Poste", accueil:"Accueil QSE" };

  // ── Créer un chantier ──
  const creerChantier = () => {
    const nom = newChantierNom.trim();
    if (!nom || chantiers.includes(nom)) return;
    saveChantiers([...chantiers, nom]);
    setNewChantierNom("");
    setShowNewChantier(false);
  };

  // ── Supprimer un chantier ──
  const supprimerChantier = (nom) => {
    saveChantiers(chantiers.filter(c => c !== nom));
    if (chantierOuvert === nom) setChantierOuvert(null);
  };

  // ── Docs d'un chantier spécifique ──
  // Comparaison normalisée (insensible casse + espaces)
  const norm = (s) => (s||"").trim().toLowerCase();
  const docsChantier = (nom) => docs.filter(d => norm(d.chantier) === norm(nom));

  // ── Docs sans chantier assigné ──
  const docsSansChantier = docs.filter(d => !chantiers.some(c => norm(c) === norm(d.chantier)));

  // ── Déplacer un doc vers un chantier ──
  const deplacerDoc = async (docId, nomChantier) => {
    if (supabaseReady()) {
      try {
        // Récupérer le doc actuel
        const res = await sbFetch(`/documents?id=eq.${docId}`);
        const rows = await res.json();
        if (rows.length > 0) {
          const doc = rows[0];
          const updatedPayload = { ...doc.payload, chantier: nomChantier };
          await sbFetch(`/documents?id=eq.${docId}`, {
            method: "PATCH", prefer: "return=minimal",
            body: JSON.stringify({ chantier: nomChantier, payload: updatedPayload })
          });
          // Recharger
          const allRes = await sbFetch("/documents?order=saved_at.desc&limit=500");
          const allRows = await allRes.json();
          const parsed = allRows.map(r => ({ ...r.payload, id: r.id, savedAt: r.saved_at }));
          // Mettre à jour le state parent via callback
          window._refreshDocs && window._refreshDocs(parsed);
        }
      } catch(e) { console.error(e); }
    } else {
      const saved = JSON.parse(localStorage.getItem("bonna_docs_v2") || "[]");
      const updated = saved.map(d => d.id === docId ? { ...d, chantier: nomChantier } : d);
      localStorage.setItem("bonna_docs_v2", JSON.stringify(updated));
    }
    setShowMoveModal(null);
  };

  // ── Vue liste filtrée (mode "tous") ──
  const filtered = docs
    .filter(d => filter === "tous" || d.type === filter)
    .sort((a,b) => sortAsc ? a.savedAt.localeCompare(b.savedAt) : b.savedAt.localeCompare(a.savedAt));

  // ── Carte document (rendu inline pour compatibilité Babel CDN) ──
  const renderDocCard = (doc) => (
    <div key={doc.id} style={s.archiveCard}>
      <div style={s.archiveIcon(doc.type)}>{icons[doc.type]}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {["securite","notice","accueil"][["securite","notice","accueil"].indexOf(doc.type)]&&
            (doc.type==="securite"?"Fiche Sécurité":doc.type==="notice"?"Notice Poste":"Accueil QSE")}
          {doc.nom ? " — "+doc.nom : ""}
        </div>
        <div style={{fontSize:10,color:C.gray,marginTop:1,fontFamily:"monospace"}}>
          {doc.chantier} · {doc.date}
        </div>
      </div>
      <div style={{display:"flex",gap:5}}>
        <button style={s.iconBtn} title="Déplacer" onClick={()=>setShowMoveModal(doc)}>📁</button>
        <button style={s.iconBtn} onClick={()=>onEdit(doc)}>✏️</button>
        <button style={s.iconBtn} onClick={()=>onExportPDF(doc)}>📄</button>
        <button style={{...s.iconBtn,color:C.danger}} onClick={()=>setConfirmDeleteId(doc.id)}>🗑</button>
      </div>
    </div>
  );

  return (
    <div style={s.view}>

      {/* ── Header ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:700}}>
          {chantierOuvert ? (
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <button onClick={()=>setChantierOuvert(null)}
                style={{background:"none",border:"none",cursor:"pointer",fontSize:18,lineHeight:1,padding:0,color:C.blue}}>
                ←
              </button>
              📁 {chantierOuvert}
            </span>
          ) : "Documents"}
        </div>
        <div style={{display:"flex",gap:6}}>
          {!chantierOuvert && (
            <>
              <button
                onClick={()=>setView(v=>v==="chantiers"?"tous":"chantiers")}
                style={{background:C.white,border:`1.5px solid ${C.grayLight}`,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:600,color:view==="chantiers"?C.blueMid:C.gray}}>
                {view==="chantiers" ? "📋 Liste" : "📁 Chantiers"}
              </button>
              {view==="tous" && (
                <button onClick={()=>setSortAsc(p=>!p)}
                  style={{background:C.white,border:`1.5px solid ${C.grayLight}`,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                  ⇅ {sortAsc?"Date ↑":"Date ↓"}
                </button>
              )}
            </>
          )}
        </div>
      </div>

      {/* ══════════ VUE CHANTIERS ══════════ */}
      {!chantierOuvert && view === "chantiers" && (
        <>
          {/* Bouton créer chantier */}
          {!showNewChantier ? (
            <button onClick={()=>setShowNewChantier(true)} style={{
              width:"100%", padding:"12px", marginBottom:12,
              background:C.white, border:`2px dashed ${C.blueMid}`,
              borderRadius:10, cursor:"pointer", color:C.blueMid,
              fontFamily:"inherit", fontSize:13, fontWeight:600,
              display:"flex", alignItems:"center", justifyContent:"center", gap:6
            }}>
              ＋ Créer un dossier chantier
            </button>
          ) : (
            <div style={{background:C.white,borderRadius:10,padding:12,marginBottom:12,boxShadow:s.card.boxShadow}}>
              <label style={s.label}>Nom du chantier</label>
              <div style={{display:"flex",gap:8,marginTop:4}}>
                <input
                  value={newChantierNom}
                  onChange={e=>setNewChantierNom(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&creerChantier()}
                  placeholder="Ex : Port de Bordeaux, Chantier Lyon…"
                  autoFocus
                  style={{...s.input,flex:1}}
                />
                <button onClick={creerChantier}
                  style={{background:C.blue,color:"#fff",border:"none",borderRadius:7,padding:"8px 14px",fontFamily:"inherit",fontWeight:700,cursor:"pointer",fontSize:13}}>
                  Créer
                </button>
                <button onClick={()=>{setShowNewChantier(false);setNewChantierNom("");}}
                  style={{background:C.bg,border:`1.5px solid ${C.grayLight}`,borderRadius:7,padding:"8px 10px",fontFamily:"inherit",cursor:"pointer",fontSize:13}}>
                  ✕
                </button>
              </div>
            </div>

          {/* Liste des dossiers chantiers */}
          {chantiers.length === 0 && docsSansChantier.length === 0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:C.gray}}>
              <div style={{fontSize:40,marginBottom:10}}>📂</div>
              <p style={{fontSize:13}}>Aucun document enregistré.<br/>Créez un dossier chantier pour commencer.</p>
            </div>
          ) : (
            <>
              {chantiers.filter(nom => nom && nom !== "—" && nom.trim() !== "").map(nom => {
                const nb = docsChantier(nom).length;
                return (
                  <div key={nom} style={{
                    background:C.white, borderRadius:10,
                    boxShadow:"0 2px 12px rgba(26,58,110,0.08)",
                    marginBottom:9, overflow:"hidden"
                  }}>
                    <div
                      onClick={()=>setChantierOuvert(nom)}
                      style={{
                        display:"flex", alignItems:"center", gap:12,
                        padding:"13px 14px", cursor:"pointer",
                      }}
                    >
                      <div style={{
                        width:42, height:42, borderRadius:10,
                        background:C.blueLight,
                        display:"flex", alignItems:"center", justifyContent:"center",
                        fontSize:22, flexShrink:0,
                      }}>📁</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:14,color:C.text}}>{nom}</div>
                        <div style={{fontSize:11,color:C.gray,marginTop:1}}>

                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <button

                        {docsChantier(nom).slice(-2).reverse().map(doc=>(

                            <span>{icons[doc.type]}</span>

                              {labels[doc.type]}{doc.nom?" — "+doc.nom:""}

                      </div>

              {/* Docs sans dossier */}
              {docsSansChantier.length > 0 && (
                <>
                  <div style={{fontSize:11,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:0.5,margin:"12px 0 8px"}}>

        </div>
      )}

      {/* ══════════ MODALE CONFIRMER SUPPRESSION ══════════ */}
      {confirmDeleteId && (

            <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>Supprimer ce document ?</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:20,lineHeight:1.5}}>Cette action est irréversible. Le document sera définitivement effacé.</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfirmDeleteId(null)}
                style={{flex:1,padding:"11px",background:C.bg,border:`1.5px solid ${C.grayLight}`,borderRadius:9,fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                Annuler

              <button onClick={()=>{onDelete(confirmDeleteId);setConfirmDeleteId(null);}}
                style={{flex:1,padding:"11px",background:C.danger,border:"none",borderRadius:9,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",color:"#fff"}}>
                🗑 Supprimer

      {/* ══════════ MODALE DÉPLACER ══════════ */}
      {showMoveModal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:400,display:"flex",alignItems:"flex-end"}}>

            <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>📁 Déplacer vers un dossier</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:16}}>
              {labels[showMoveModal.type]}{showMoveModal.nom?" — "+showMoveModal.nom:""}

            {chantiers.length === 0 ? (
              <div style={{color:C.gray,fontSize:13,textAlign:"center",padding:"16px 0"}}>

              <div key={nom}
                onClick={()=>deplacerDoc(showMoveModal.id, nom)}
                style={{
                  display:"flex",alignItems:"center",gap:10,
                  padding:"12px 14px",borderRadius:10,marginBottom:7,

      )}

    </div>
  );
}




// ─── VUE PÉNIBILITÉ ──────────────────────────────────────────────────────────
function VuePenibilite({ docs }) {
  const [expanded, setExpanded] = useState({});

  const plongees = docs.filter(d=>d.type==="securite").flatMap(fiche=>
    (fiche.data.operateurs||[]).flatMap(op=>{
      const prof=parseFloat(op.prof);
      if(!op.equipe||isNaN(prof)||prof<=12) return [];
      return [{nom:op.equipe,profondeur:prof,tpsFond:parseFloat(op.tpsFond)||null,duree:parseFloat(op.duree)||null,date:fiche.data.date||fiche.date||"—",site:fiche.data.site||fiche.chantier||"—",methode:fiche.data.methode||""}];
    })
  );

  const total = plongees.length;
  const profMoy = total ? (plongees.reduce((s,p)=>s+p.profondeur,0)/total).toFixed(1) : "—";
  const byNom = {};
  plongees.forEach(p=>{ if(!byNom[p.nom]) byNom[p.nom]=[]; byNom[p.nom].push(p); });
  const nbAlert = Object.values(byNom).filter(a=>a.length>=60).length;

  const exportCSV = () => {
    if (!total) { alert("Aucune donnée à exporter"); return; }
    // ── SheetJS xlsx ──
    const XLSX = window.XLSX_LIB;
    if (XLSX) {
      const wb = XLSX.utils.book_new();
      // Feuille 1 — Registre
      const rows1 = [
        ["BONNA TP — DOSSIER PÉNIBILITÉ PLONGEURS"],
        [`Exporté le : ${new Date().toLocaleDateString("fr-FR")}`],
        [],
        ["N°","Nom du plongeur","Date","Site / Chantier","Profondeur (m)","Temps fond (min)","Durée totale (min)","Méthode"],
        ...plongees.map((p,i) => [i+1, p.nom, p.date, p.site, p.profondeur, p.tpsFond||"", p.duree||"", p.methode||""]),
        [],
        ["TOTAL PLONGÉES > 12m :", total],
      ];
      const ws1 = XLSX.utils.aoa_to_sheet(rows1);
      ws1["!cols"] = [{wch:4},{wch:20},{wch:12},{wch:22},{wch:13},{wch:16},{wch:16},{wch:14}];
      XLSX.utils.book_append_sheet(wb, ws1, "Registre >12m");
      // Feuille 2 — Synthèse
      const rows2 = [
        ["SYNTHÈSE PAR PLONGEUR"],
        [],
        ["Nom","Nb plongées >12m","Prof. moy. (m)","Tps fond total (min)","Seuil annuel","Statut C2P"],
        ...Object.entries(byNom).map(([n,a]) => {
          const nb=a.length, pm=(a.reduce((s,x)=>s+x.profondeur,0)/nb).toFixed(1), tt=a.reduce((s,x)=>s+(x.tpsFond||0),0);
          return [n, nb, parseFloat(pm), tt, 60, nb>=60?"⚠ SEUIL ATTEINT":nb>=48?"→ Proche":"✓ OK"];
        }),
      ];
      const ws2 = XLSX.utils.aoa_to_sheet(rows2);
      ws2["!cols"] = [{wch:20},{wch:16},{wch:14},{wch:20},{wch:12},{wch:18}];
      XLSX.utils.book_append_sheet(wb, ws2, "Synthèse par plongeur");
      XLSX.writeFile(wb, `Penibilite_BONNATP_${new Date().toISOString().slice(0,10)}.xlsx`);
    } else {
      // Fallback CSV si SheetJS non dispo
      let csv = "\uFEFF";
      csv += "BONNA TP — DOSSIER PÉNIBILITÉ\n";
      csv += "Nom;Profondeur (m);Temps fond (min);Durée (min);Date;Site;Méthode\n";
      plongees.forEach(p => { csv += `${p.nom};${p.profondeur};${p.tpsFond||""};${p.duree||""};${p.date};${p.site};${p.methode}\n`; });
      csv += `\nTOTAL;${total}\n`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8;"}));
      a.download = `Penibilite_BONNATP_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
  };

  const exportPDF = () => {
    if (!total) { alert("Aucune donnée à exporter"); return; }
    const date = new Date().toLocaleDateString("fr-FR");
    const pm = (plongees.reduce((s,p)=>s+p.profondeur,0)/plongees.length).toFixed(1);
    const rows = plongees.map((p,i) =>
      `<tr><td>${i+1}</td><td><b>${p.nom}</b></td><td>${p.date}</td><td>${p.site}</td>
      <td style="text-align:center" ${p.profondeur>20 ? 'class="alerte"' : ""}>${p.profondeur}</td>
      <td style="text-align:center">${p.tpsFond||"\u2014"}</td><td style="text-align:center">${p.duree||"\u2014"}</td>
      <td>${p.methode||"\u2014"}</td></tr>`).join("");
    const synthRows = Object.entries(byNom).map(([n,a]) => {
      const nb=a.length, p2=(a.reduce((s,x)=>s+x.profondeur,0)/nb).toFixed(1), tt=a.reduce((s,x)=>s+(x.tpsFond||0),0);
      const st=nb>=60?"⚠ SEUIL ATTEINT":nb>=48?"→ Proche":"✓ OK";
      const cls=nb>=60?"alert":nb>=48?"warn":"ok";
      return `<tr><td><b>${n}</b></td><td style="text-align:center"><b>${nb}</b></td>
        <td style="text-align:center">${p2}</td><td style="text-align:center">${tt}</td>
        <td style="text-align:center">60</td><td class="${cls}">${st}</td></tr>`;
    }).join("");
    const cssPenib = 'body{font-family:Arial,sans-serif;font-size:11px;padding:15px;margin:0}\n      h1{font-size:14px;color:#1a3a6e;border-bottom:3px solid #1a3a6e;padding-bottom:5px}\n      h2{font-size:11px;background:#1a3a6e;color:#fff;padding:5px 9px;margin:12px 0 5px}\n      .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0}\n      .stat{border:2px solid #2356a8;border-radius:5px;padding:7px;text-align:center}\n      .sv{font-size:18px;font-weight:bold;color:#e85d1a}.sl{font-size:9px;color:#666;text-transform:uppercase}\n      table{width:100%;border-collapse:collapse;margin-bottom:9px;font-size:10px}\n      th{background:#2356a8;color:#fff;padding:4px 6px;text-align:left;border:1px solid #ccc}\n      td{border:1px solid #ccc;padding:4px 6px}tr:nth-child(even)td{background:#f4f5f7}\n      .ok{color:#1a7a4a}.warn{color:#e85d1a}.alert{color:#c0392b;font-weight:bold}\n      .tr-tot td{background:#1a3a6e!important;color:#fff!important;font-weight:bold!important}\n      .info{background:#e8eef8;border-left:3px solid #2356a8;padding:7px 9px;font-size:9px;margin-top:10px}\n      .note{background:#fff3e8;border-left:3px solid #e85d1a;padding:6px 9px;font-size:10px;margin-top:8px}\n      .page-break{page-break-before:always}\n      .part-sub{font-size:10px;font-weight:bold;color:#1a3a6e;margin:8px 0 4px}\n      .chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-bottom:6px}\n      .chk{font-size:9px;line-height:1.4}\n      .risk-illustration{width:100%;display:block;border:1px solid #ccc;border-radius:4px;margin:6px 0 10px}\n      ';
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Pénibilité BONNA TP</title>
      <style>${cssPenib}</style></head><body>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        <div style="background:#e85d1a;color:#fff;font-weight:bold;padding:3px 9px;font-size:12px">BONNA TP</div>
        <span style="color:#888;font-size:10px">${date}</span>
      </div>
      <h1>DOSSIER PÉNIBILITÉ PLONGEURS — Facteur C2P</h1>
      <div class="stats">
        <div class="stat"><div class="sv">${total}</div><div class="sl">Total &gt;12m</div></div>
        <div class="stat"><div class="sv">${Object.keys(byNom).length}</div><div class="sl">Plongeurs</div></div>
        <div class="stat"><div class="sv">${pm}m</div><div class="sl">Prof. moyenne</div></div>
        <div class="stat"><div class="sv">${nbAlert}</div><div class="sl">Seuil atteint</div></div>
      </div>
      <h2>SYNTHÈSE PAR PLONGEUR</h2>
      <table><thead><tr><th>Nom</th><th>Nb &gt;12m</th><th>Prof.moy(m)</th>
        <th>Tps fond(min)</th><th>Seuil/an</th><th>Statut C2P</th></tr></thead>
      <tbody>${synthRows}</tbody></table>
      <h2>REGISTRE DÉTAILLÉ</h2>
      <table><thead><tr><th>N°</th><th>Nom</th><th>Date</th><th>Site</th>
        <th>Prof(m)</th><th>Tps fond</th><th>Durée</th><th>Méthode</th></tr></thead>
      <tbody>${rows}
      <tr class="tr-tot"><td colspan="4" style="text-align:right">TOTAL :</td>
        <td colspan="4">${total} plongée${total>1?"s":""}</td></tr>
      </tbody></table>
      <div class="info">⚖ Décret n°2015-1888 — Seuil 60 interventions/an. À transmettre à la médecine du travail.</div>
      <div class="note">📱 iPhone : Partager → Imprimer ou Enregistrer en PDF</div>
    </body></html>`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
    a.download = `Penibilite_BONNATP_${new Date().toISOString().slice(0,10)}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  return (
    <div style={s.view}>
      <div style={s.infoBanner}>
        <strong>⚖ Facteur de pénibilité C2P — Travaux subaquatiques</strong><br/>
        Seuil : <strong>60 plongées/an à profondeur &gt; 12 m</strong> (décret n°2015-1888).<br/>
        Se remplit automatiquement depuis les Fiches de Sécurité sauvegardées.
      </div>

      <div style={s.statGrid}>
        {[[total,"Total plongées >12m","seuil : 60/an",C.accent],[Object.keys(byNom).length,"Plongeurs exposés","actifs",C.blueMid],[total?profMoy+"m":"—","Prof. moyenne","mètres",C.success],[nbAlert,"Seuil atteint","plongeur(s)",C.danger]].map(([v,l,sub,color],i)=>(
          <div key={i} style={s.statCard(color)}>

          <div style={{fontSize:36,marginBottom:8}}>🤿</div>

                <div style={{marginTop:6}}>
                  {arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((p,i)=>(

                      <div style={{background:p.profondeur>20?"#fff3e8":C.blueLight,color:p.profondeur>20?C.accent:C.blueMid,fontFamily:"monospace",fontWeight:700,fontSize:11,padding:"2px 7px",borderRadius:5,flexShrink:0,minWidth:46,textAlign:"center"}}>{p.profondeur}m</div>

                    </div>

                </div>
              )}
            </div>
          </div>

      })}

      {total>0 && (
        <>
          <div style={s.sectionTitle}><span style={{display:"block",width:4,height:16,background:C.accent,borderRadius:2}}></span>Registre complet</div>

            <div style={{...s.cardBody,padding:0,overflowX:"auto"}}>
              <table style={{...s.penibTable,minWidth:480}}>
                <thead><tr>

                </tr></thead>
                <tbody>
                  {plongees.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((p,i)=>(
                    <tr key={i} style={{background:i%2===0?"#fff":C.bg}}>
                      <td style={{...s.penibTd,textAlign:"center"}}>{i+1}</td>
                      <td style={{...s.penibTd,fontWeight:600}}>{p.nom}</td>
                      <td style={{...s.penibTd,textAlign:"center",fontFamily:"monospace",fontSize:10}}>{p.date}</td>
                      <td style={s.penibTd}>{p.site}</td>
                      <td style={{...s.penibTd,textAlign:"center",fontWeight:p.profondeur>20?700:400,color:p.profondeur>20?C.accent:C.text}}>{p.profondeur}</td>
                      <td style={{...s.penibTd,textAlign:"center"}}>{p.tpsFond||"—"}</td>
                      <td style={{...s.penibTd,textAlign:"center"}}>{p.duree||"—"}</td>
                      <td style={s.penibTd}>{p.methode||"—"}</td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr style={{background:C.blue}}>
                    <td colSpan={4} style={{...s.penibTfootTd,textAlign:"right"}}>TOTAL — Plongées &gt; 12m :</td>
                    <td colSpan={4} style={{...s.penibTfootTd,fontSize:14}}>{total} plongée{total>1?"s":""}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </>
      )}

      <div style={{display:"flex",gap:9,marginTop:4}}>
        <button style={{...s.btn("primary"),flex:1}} onClick={exportCSV}>📊 Export Excel / CSV</button>
        <button style={{...s.btn("secondary"),flex:1}} onClick={exportPDF}>📄 Export PDF</button>
      </div>
    </div>
  );
}

// ─── VUE CARNET PLONGÉE ──────────────────────────────────────────────────────
function VueCarnetPlongee({ docs }) {
  const [openDiver, setOpenDiver] = useState(null);

  // Extraire toutes les plongées individuelles depuis les Fiches de Sécurité
  const plongees = docs.filter(d=>d.type==="securite").flatMap(fiche=>{
    const data = fiche.data || {};
    return (data.operateurs||[]).flatMap(op=>{
      if (!op.equipe || !op.equipe.trim()) return [];
      const prof = parseFloat(op.prof);
      if (isNaN(prof) || prof<=0) return [];
      return [{
        nom: op.equipe.trim(),
        date: data.date || fiche.date || "—",
        site: data.site || fiche.chantier || "—",
        prof,
        duree: op.duree || "",
        tpsFond: op.tpsFond || "",
        p12: op.p12 || "", p9: op.p9 || "", p6: op.p6 || "", p3: op.p3 || "",
        gaz: data.melange || "",
        methode: data.methode || "",
      }];
    });
  });

  // Regrouper par plongeur
  const byNom = {};
  plongees.forEach(p=>{ if(!byNom[p.nom]) byNom[p.nom]=[]; byNom[p.nom].push(p); });
  const divers = Object.keys(byNom).sort();

  const totalMin = (arr) => arr.reduce((s,p)=>{
    const d = parseFloat(p.duree);
    return s + (isNaN(d)?0:d);
  }, 0);

  const formatPaliers = (p) => {
    const parts = [];
    if (p.p12) parts.push(`12m:${p.p12}`);
    if (p.p9) parts.push(`9m:${p.p9}`);
    if (p.p6) parts.push(`6m:${p.p6}`);
    if (p.p3) parts.push(`3m:${p.p3}`);
    return parts.length ? parts.join(" · ") : "—";
  };

  return (
    <div style={s.view}>
      <div style={s.infoBanner}>
        <strong>📘 Carnet de plongée individuel</strong><br/>
        Regroupe automatiquement, pour chaque plongeur, toutes les plongées enregistrées dans les Fiches de Sécurité : date, temps de plongée total, profondeur, paliers et gaz respiré.
      </div>

      {divers.length===0 ? (
        <div style={{textAlign:"center",padding:"36px 20px",color:C.gray}}>
          <div style={{fontSize:36,marginBottom:8}}>📘</div>
          <p style={{fontSize:13}}>Aucune plongée enregistrée.<br/>Remplissez et sauvegardez des Fiches de Sécurité avec le nom des plongeurs.</p>
        </div>
      ) : divers.map(nom=>{
        const arr = byNom[nom].slice().sort((a,b)=>b.date.localeCompare(a.date));
        const nb = arr.length;
        const tMin = totalMin(arr);
        const profMax = Math.max(...arr.map(p=>p.prof));
        const open = openDiver===nom;
        return (
          <div key={nom} style={{...s.card, marginBottom:10}}>
            <div onClick={()=>setOpenDiver(open?null:nom)} style={{padding:"12px 14px", cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontWeight:700,fontSize:14}}>🤿 {nom}</div>
                <div style={{color:C.blueMid,fontSize:13}}>{open?"▾":"▸"}</div>
              </div>
              <div style={{display:"flex",gap:14,fontSize:11,color:C.gray,marginTop:5}}>
                <span><strong style={{color:C.text,fontFamily:"monospace",fontSize:13}}>{nb}</strong> plongée{nb>1?"s":""}</span>
                <span>Tps total <strong style={{color:C.text,fontFamily:"monospace"}}>{tMin} min</strong></span>
                <span>Prof. max <strong style={{color:C.text,fontFamily:"monospace"}}>{profMax} m</strong></span>
              </div>
            </div>
            {open && (
              <div style={{borderTop:`1px solid ${C.grayLight}`, padding:"4px 14px 10px"}}>
                {arr.map((p,i)=>(
                  <div key={i} style={{padding:"8px 0", borderBottom: i<arr.length-1?`1px solid ${C.grayLight}`:"none"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                      <span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:C.blue}}>{p.date}</span>
                      <span style={{background:C.blueLight,color:C.blueMid,fontFamily:"monospace",fontWeight:700,fontSize:11,padding:"2px 8px",borderRadius:5}}>{p.prof} m</span>
                    </div>
                    <div style={{fontSize:11,color:C.text,marginBottom:2}}>{p.site}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:10,fontSize:10,color:C.gray}}>
                      <span>Tps total : <strong style={{color:C.text}}>{p.duree||"—"} min</strong></span>
                      <span>Tps fond : <strong style={{color:C.text}}>{p.tpsFond||"—"} min</strong></span>
                      <span>Gaz : <strong style={{color:C.text}}>{p.gaz||"—"}</strong></span>
                    </div>
                    <div style={{fontSize:10,color:C.gray,marginTop:2}}>Paliers : <strong style={{color:C.text,fontFamily:"monospace"}}>{formatPaliers(p)}</strong></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}




// ─── APP PRINCIPALE ───────────────────────────────────────────────────────────
function App() {
  // Charger SheetJS
  useEffect(() => {
    if (window.XLSX_LIB) return;
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.onload = () => { window.XLSX_LIB = window.XLSX || XLSX; };
    document.head.appendChild(script);
  }, []);

  const [tab, setTab] = useState("securite");
  const [securite, setSecurite] = useState(emptySecurite);
  const [notice, setNotice] = useState(emptyNotice);
  const [accueil, setAccueil] = useState(emptyAccueil);
  const [docs, setDocs] = useState(() => {
    // Charger immédiatement depuis localStorage au démarrage
    return loadDocs();
  });
  const [syncing, setSyncing] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [toast, setToast] = useState("");
  const [editingDocId, setEditingDocId] = useState(null); // id du doc en cours d'édition

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2500); };

  // ── Charger depuis Supabase ──
  const fetchDocs = async () => {
    if (!supabaseReady()) {
      // Pas de Supabase : charger depuis localStorage
      const local = loadDocs();
      if (local.length > 0) setDocs(local);
      return;
    }
    try {
      setSyncing(true);
      const res = await sbFetch("/documents?order=saved_at.desc&limit=500");
      if (!res.ok) {
        // Supabase KO : utiliser le cache local
        const local = loadDocs();
        if (local.length > 0) setDocs(local);
        return;
      }
      const rows = await res.json();
      if (!Array.isArray(rows)) {
        const local = loadDocs();
        if (local.length > 0) setDocs(local);
        return;
      }
      // Fusionner : Supabase + localStorage (pour docs pas encore sync)
      const remote = rows.map(r => ({ ...(r.payload||r), id: r.id, savedAt: r.saved_at }));
      const local = loadDocs();
      // Ajouter les docs locaux qui ne sont pas dans Supabase
      const remoteIds = new Set(remote.map(d => String(d.id)));
      const localOnly = local.filter(d => !remoteIds.has(String(d.id)));
      const merged = [...remote, ...localOnly];
      setDocs(merged);
      saveDocs(merged);
      setLastSync(new Date());
    } catch(e) {
      console.error("Sync error:", e);
      // En cas d'erreur réseau : afficher le cache local
      const local = loadDocs();
      if (local.length > 0) setDocs(local);
    } finally {
      setSyncing(false);
    }
  };

  // Charger au démarrage + polling toutes les 30s
  useEffect(() => {
    fetchDocs();
    const interval = setInterval(fetchDocs, 30000);
    return () => clearInterval(interval);
  }, []);

  const showToast2 = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2500); };

  const saveDoc = async (type, data) => {
    const labels={securite:"Fiche Sécurité",notice:"Notice Poste Hyperbare",accueil:"Accueil QSE Renforcé"};
    const newDoc = {
      id: Date.now(),
      type, label: labels[type],
      chantier: data.site||data.chantier||"—",
      date: data.date||data.dateArrivee||new Date().toISOString().slice(0,10),
      nom: data.nom ? `${data.nom} ${data.prenom||""}`.trim() : "",
      data,
      savedAt: new Date().toISOString()
    };

    // Sauvegarder dans Supabase
    if (supabaseReady()) {
      try {
        await sbFetch("/documents", {
          method: "POST",
          prefer: "return=minimal",
          body: JSON.stringify({
            id: newDoc.id,
            type: newDoc.type,
            chantier: newDoc.chantier,
            date: newDoc.date,
            nom: newDoc.nom,
            saved_at: newDoc.savedAt,
            payload: newDoc
          })
        });
        await fetchDocs(); // recharger pour tous
        showToast("✓ Document sauvegardé et synchronisé");
      } catch(e) {
        // Fallback local
        const updated=[...docs,newDoc];
        saveDocs(updated); setDocs(updated);
        showToast("✓ Sauvegardé localement (hors ligne)");
      }
    } else {
      const updated=[...docs,newDoc];
      saveDocs(updated); setDocs(updated);
      showToast("✓ Document sauvegardé");
    }
  };

  const updateDoc = async (type, data) => {
    if (!editingDocId) return;
    const labels={securite:"Fiche Sécurité",notice:"Notice Poste Hyperbare",accueil:"Accueil QSE Renforcé"};

      id: editingDocId,
      type, label: labels[type],
      chantier: data.site||data.chantier||"—",
      date: data.date||data.dateArrivee||new Date().toISOString().slice(0,10),
      nom: data.nom ? `${data.nom} ${data.prenom||""}`.trim() : "",

    };
    if (supabaseReady()) {
      try {
        await sbFetch(`/documents?id=eq.${editingDocId}`, {
          method: "PATCH",
          prefer: "return=minimal",
          body: JSON.stringify({
            chantier: updatedDoc.chantier,
            date: updatedDoc.date,
            nom: updatedDoc.nom,
            saved_at: updatedDoc.savedAt,
            payload: updatedDoc

          </div>
          <div class="chk-grid" style="grid-template-columns:1fr">${typeSalarieHtml}</div>
        </div>

        <div class="note" style="margin-top:0">
          Cet Accueil Sécurité Renforcé est destiné au personnel ne connaissant pas ou mal nos <b>Risques Métiers</b>.
          Les risques liés au contexte de travail sont vus dans l'Accueil QSE Terrain (fiche 042_QSE_FO).
        </div>

        <h2>A. PRÉSENTATION DES RISQUES ET MESURES DE PRÉVENTION</h2>
        <div class="chk-grid" style="grid-template-columns:1fr">${risquesHtml}</div>

        <img class="risk-illustration" src="${viergeURI}" alt="Risques et mesures de prévention - schéma à compléter"/>

        <div class="part-sub">Risques identifiés et mesures de prévention (observations) :</div>
        <div style="border:1px solid #ccc;min-height:50px;padding:6px;font-size:10px;white-space:pre-wrap">${data.risquesTexte||""}</div>

        <h2>B. ENGAGEMENTS SANTÉ ET SÉCURITÉ AU TRAVAIL DU SALARIÉ</h2>
        <div class="chk-grid">${engagementsHtml}</div>

        <table style="margin-top:8px"><thead><tr><th>DATE ACCUEIL</th><th>Nom &amp; Visa du Chef Chantier/Atelier</th><th>Nom &amp; Visa du Salarié</th></tr></thead>
        <tbody><tr>
          <td style="text-align:center;font-weight:bold">${data.dateSign||""}</td>
          <td>${data.chefNom||""}${sigChefAccHtml}</td>
          <td>${data.salNom||""}${sigSalAccHtml}</td>
        </tr></tbody></table>

        <div class="page-break"></div>

        <h1>043_QSE_FO — ACCUEIL QSE RENFORCÉ — Page 2/2</h1>
        <h2>RISQUES ET MESURES DE PRÉVENTION, éléments de correction</h2>
        <img class="risk-illustration" src="${correctionURI}" alt="Risques et mesures de prévention - correction"/>

        <div class="note">
          ➔ Découper selon les pointillés, ou scanner, ou photographier, et transmettre la partie évaluation ci-dessous à la correspondante QSE.
        </div>

        <h2>C. ÉVALUATION APRÈS 1 SEMAINE</h2>
        <table><thead><tr><th>Critère</th><th>Mauvais</th><th>Moyen</th><th>Bon</th><th>Très bon</th></tr></thead>
        <tbody>${evalRows}</tbody></table>
        <div class="f" style="margin-top:6px"><b>➔ Souhaitez-vous continuer / reprendre cette personne :</b><span>${data.continuer||""}</span></div>

        <table style="margin-top:8px"><thead><tr><th>DATE EVALUATION</th><th>Nom &amp; Visa du Chef Chantier</th><th>Nom &amp; Visa du Salarié</th></tr></thead>
        <tbody><tr>
          <td style="text-align:center;font-weight:bold">${data.dateEval||""}</td>
          <td>${data.chefNomEval||""}${sigChefEvalHtml}</td>
          <td>${data.salNomEval||""}${sigSalEvalHtml}</td>
        </tr></tbody></table>`;
    }

    const labels = {securite:"Fiche_Securite",notice:"Notice_Poste_Hyperbare",accueil:"Accueil_QSE_Renforce"};
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
      <title>${labels[type]}</title><style>${css}</style></head>
      <body>
        <div class="logo">
          <span class="logo-box">BONNA TP</span>
          <span style="color:#888;font-size:10px">${date}</span>
        </div>
        ${body}
        <div class="note">📱 Sur iPhone : appuyez sur le bouton Partager → Imprimer, ou Enregistrer en PDF</div>
      </body></html>`;

    dlBlob(html, `${labels[type]}_${data.date||date.replace(/\//g,"-")}.html`, "text/html;charset=utf-8");
    showToast("✓ Fichier téléchargé — ouvrez-le et utilisez Imprimer pour créer le PDF");
  };

  const tabs=[{id:"securite",num:"FO-SEC",label:"Fiche Sécurité"},{id:"notice",num:"035_QSE",label:"Notice Poste"},{id:"accueil",num:"043_QSE",label:"Accueil QSE"},{id:"archive",num:"ARCHIVE",label:"Documents"},{id:"penibilite",num:"C2P",label:"Pénibilité"},{id:"carnet",num:"CARNET",label:"Carnet Plongée"}];

  return (
    <div style={s.app}>
      <div style={s.header}>
        <div style={s.logoRow}>
          <span style={s.logoBox}>BONNA TP</span>
          <span style={s.appTitle}>Formulaires Terrain</span>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={s.appSub}>Gestion sécurité hyperbare</div>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          {syncing ? (
            <span style={{fontSize:9,color:"rgba(255,255,255,0.6)",fontFamily:"monospace"}}>↻ sync…</span>
          ) : lastSync ? (
            <span style={{fontSize:9,color:"rgba(255,255,255,0.4)",fontFamily:"monospace",cursor:"pointer"}} onClick={fetchDocs}>
              ✓ {lastSync.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
            </span>
          ) : null}
        </div>
      </div>
      </div>

      <div style={s.tabBar}>
        {tabs.map(t=>(
          <button key={t.id} style={s.tabBtn(tab===t.id)} onClick={()=>setTab(t.id)}>
            <span style={s.tabNum(tab===t.id)}>{t.num}</span>{t.label}
          </button>
        ))}
      </div>

      {tab==="securite" && <VueSecurite data={securite} setData={setSecurite} onSave={()=>saveDoc("securite",securite)} onUpdate={()=>updateDoc("securite",securite)} onExportPDF={()=>genPDF("securite",securite)} editingDocId={editingDocId} onClear={()=>{setSecurite(emptySecurite());setEditingDocId(null);}} />}
      {tab==="notice" && <VueNotice data={notice} setData={setNotice} onSave={()=>saveDoc("notice",notice)} onUpdate={()=>updateDoc("notice",notice)} onExportPDF={()=>genPDF("notice",notice)} editingDocId={editingDocId} onClear={()=>{setNotice(emptyNotice());setEditingDocId(null);}} />}
      {tab==="accueil" && <VueAccueil data={accueil} setData={setAccueil} onSave={()=>saveDoc("accueil",accueil)} onUpdate={()=>updateDoc("accueil",accueil)} onExportPDF={()=>genPDF("accueil",accueil)} editingDocId={editingDocId} onClear={()=>{setAccueil(emptyAccueil());setEditingDocId(null);}} />}
      {tab==="archive" && <VueArchive docs={docs} onDelete={deleteDoc} onEdit={editDoc} onExportPDF={(doc)=>genPDF(doc.type,doc.data)} />}
      {tab==="penibilite" && <VuePenibilite docs={docs} />}
      {tab==="carnet" && <VueCarnetPlongee docs={docs} />}

      <Toast message={toast} />
    </div>
  );
}


// Monter l'app — attendre que la config Supabase soit chargée
window.__ENV_PROMISE__.then(() => {
  try {
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
    const loader = document.getElementById("loading");
    if (loader) loader.style.display = "none";
  } catch(e) {
    document.getElementById("loading").innerHTML = '<div style="padding:20px;color:#fff;font-family:monospace;font-size:12px"><b>Erreur:</b><br>' + e.message + '<br><br>' + (e.stack||'').replace(/\n/g,'<br>') + '</div>';
    console.error("App mount error:", e);
  }
});



</script>

</body>
</html>
