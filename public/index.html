function Field({ label, children, style }) {

}
function Input({ value, onChange, type="text", placeholder="" }) {
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={s.input} />;
}
function Textarea({ value, onChange, placeholder="" }) {
  return <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={s.textarea} />;
}
function RadioPill({ label, selected, onClick }) {
  return <span style={s.radioPill(selected)} onClick={onClick}>{label}</span>;
}
function RadioGroup({ name, options, value, onChange }) {
  return <div style={s.radioGroup}>{options.map(o=><RadioPill key={o.value||o} label={o.label||o} selected={value===(o.value||o)} onClick={()=>onChange(o.value||o)} />)}</div>;

// ─── BARRE IA ─────────────────────────────────────────────────────────────────
function AIBar({ form, onFill }) {
  const [text, setText] = useState("");
  const [status, setStatus] = useState({ msg:"", type:"" });
  const [loading, setLoading] = useState(false);

  const send = async () => {
    if (!text.trim()) { setStatus({msg:"Entrez une description…",type:"error"}); return; }
    setLoading(true); setStatus({msg:"⬡ Analyse en cours…",type:""});
    const prompts = {
      securite:`Extrait les infos du texte et réponds UNIQUEMENT en JSON valide sans markdown :
{"date":"YYYY-MM-DD ou vide","site":"","semaine":"","plongeeNum":"","methode":"narguilé|scaphandre|recycleur ou vide","classe":"A|B ou vide","melange":"","support":"","etatMer":"","altitude":"","vent":"","houle":"","courant":"","visibilite":"","temps":"","tempEau":"","observations":"","operateurs":[{"nom":"","heureImmersion":"","prof":"","tpsFond":""}]}
Texte: "${text}"`,
      notice:`Réponds UNIQUEMENT en JSON valide :
{"chantier":"","dateArrivee":"YYYY-MM-DD ou vide","dateDepart":"YYYY-MM-DD ou vide","nom":"","prenom":"","poste":"","typeSalarie":"CDI|CDD/Intérimaire|Retour arrêt ou vide","profondeur":"","plongeeType":"Narguilé|Bouteille|Inspection|Dérogation ou vide","supportType":"Quai|Navire ou vide","gazFond":"Air|Mélange ou vide","gazPalier":"Air|Mélange|O2 ou vide","respNom":"","salNom":""}
Texte: "${text}"`,
      accueil:`Réponds UNIQUEMENT en JSON valide :
{"chantier":"","date":"YYYY-MM-DD ou vide","nom":"","prenom":"","typeSalarie":"CDD|Intérimaire|Nouvel embauché|Retour arrêt ou vide","chefNom":"","salNom":""}
Texte: "${text}"`
    };
    try {
      const res = await fetch("/api/analyse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompts[form] })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error || "Erreur HTTP " + res.status);
      }
      const data = await res.json();
      const raw = (data.text || "{}").replace(/```json|```/g, "").trim();
      onFill(JSON.parse(raw));
      setStatus({ msg: "✓ Formulaire rempli avec succès !", type: "success" });
      setText("");
      setTimeout(() => setStatus({ msg: "", type: "" }), 3000);
    } catch(e) {
      setStatus({ msg: "⚠ " + (e.message || "Erreur de connexion"), type: "error" });
    }
    setLoading(false);
  };

  return (
    <div style={s.aiBanner}>
      <div style={s.aiTitle}><span style={{color:C.accent}}>⬡</span> REMPLISSAGE ASSISTÉ PAR IA</div>
      <div style={s.aiRow}>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder={form==="securite"?"Ex : Site Bordeaux, narguilé, 15m, OP1 Jean Dupont…" : form==="notice"?"Ex : Chantier Lyon, Jean Dupont, CDI, arrivée 10/06/2025…" : "Ex : Marie Martin, CDD, chantier Paris…"}
          style={s.aiInput} />
        <button onClick={send} disabled={loading} style={{...s.aiBtn, opacity:loading?0.7:1}}>
          {loading ? "…" : "➤"}
        </button>
      </div>
      {status.msg && <div style={s.aiFeedback(status.type)}>{status.msg}</div>}
    </div>
  );
}

// ─── SIGNATURE PAD ───────────────────────────────────────────────────────────
function SignaturePad({ label, value, onChange }) {
  const [open, setOpen] = useState(false);
  const [isEmpty, setIsEmpty] = useState(!value);
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const lastPos = useRef(null);

  // Initialiser le canvas quand la modale s'ouvre
  useEffect(() => {
    if (!open) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (value) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = value;
    }
  }, [open]);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY,
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    drawing.current = true;
    const pos = getPos(e, canvasRef.current);
    lastPos.current = pos;
    const ctx = canvasRef.current.getContext("2d");
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = "#1a3a6e";
    ctx.fill();
    setIsEmpty(false);
  };

  const draw = (e) => {
    e.preventDefault();
    if (!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.beginPath();
    ctx.moveTo(lastPos.current.x, lastPos.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = "#1a3a6e";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    lastPos.current = pos;
  };

  const stopDraw = () => { drawing.current = false; };

  const clear = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    setIsEmpty(true);
  };

  const confirm = () => {
    if (canvasRef.current) {
      const data = isEmpty ? "" : canvasRef.current.toDataURL("image/png");
      onChange(data);
    }
    setOpen(false);
  };

  const cancel = () => setOpen(false);

  return (
    <>
      {/* Aperçu compact — clic pour ouvrir */}
      <div style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <label style={s.label}>{label}</label>
          {value && (
            <button onClick={()=>{onChange(""); setIsEmpty(true);}}
              style={{background:"none",border:"none",color:C.danger,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",padding:"2px 6px"}}>
              ✕ Effacer
            </button>
          )}
        </div>
        <div
          onClick={() => setOpen(true)}
          style={{
            border:`2px solid ${value ? C.blueMid : C.grayLight}`,
            borderRadius:9, background:"#fff", height:72,
            display:"flex", alignItems:"center", justifyContent:"center",
            cursor:"pointer", overflow:"hidden", position:"relative",
          }}
        >
          {value ? (
            <img src={value} style={{width:"100%",height:"100%",objectFit:"contain"}} alt="signature" />
          ) : (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:C.gray}}>
              <span style={{fontSize:22}}>✍</span>
              <span style={{fontSize:11,fontStyle:"italic"}}>Appuyez pour signer</span>
            </div>
          )}
        </div>
      </div>

      {/* Modale plein écran pour signer */}
      {open && (
        <div style={{
          position:"fixed", inset:0, zIndex:600,
          background:"rgba(0,0,0,0.7)",
          display:"flex", flexDirection:"column",
        }}>
          {/* Header modale */}
          <div style={{
            background:C.blue, padding:"14px 16px",
            display:"flex", alignItems:"center", justifyContent:"space-between",
            flexShrink:0,
          }}>
            <div>
              <div style={{color:"#fff",fontWeight:700,fontSize:15}}>{label}</div>
              <div style={{color:"rgba(255,255,255,0.55)",fontSize:11,marginTop:1}}>Signez dans la zone ci-dessous</div>
            </div>
            <button onClick={cancel} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"#fff",padding:"7px 14px",fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer"}}>
              Annuler
            </button>
          </div>

          {/* Zone de signature — occupe tout l'espace disponible */}
          <div style={{flex:1, background:"#f0f4ff", display:"flex", flexDirection:"column", padding:12, gap:10, overflow:"hidden"}}>
            <div style={{
              flex:1, background:"#fff",
              borderRadius:12, border:`2px dashed ${C.blueMid}`,
              position:"relative", overflow:"hidden", touchAction:"none",
            }}>
              {isEmpty && (
                <div style={{
                  position:"absolute", inset:0, pointerEvents:"none",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  flexDirection:"column", gap:8,
                }}>
                  <span style={{fontSize:40, opacity:0.2}}>✍</span>
                  <span style={{fontSize:13, color:C.gray, fontStyle:"italic"}}>Tracez votre signature ici</span>
                </div>
              )}
              <canvas
                ref={canvasRef}
                width={900}
                height={400}
                style={{display:"block", width:"100%", height:"100%", touchAction:"none", cursor:"crosshair"}}
                onMouseDown={startDraw}
                onMouseMove={draw}
                onMouseUp={stopDraw}
                onMouseLeave={stopDraw}
                onTouchStart={startDraw}
                onTouchMove={draw}
                onTouchEnd={stopDraw}
              />
            </div>

            {/* Actions */}
            <div style={{display:"flex", gap:10, flexShrink:0}}>
              <button onClick={clear}
                style={{flex:1, padding:"13px", background:"#fff", border:`1.5px solid ${C.grayLight}`, borderRadius:10, fontFamily:"inherit", fontSize:13, fontWeight:600, cursor:"pointer", color:C.danger}}>
                🗑 Effacer
              </button>
              <button onClick={confirm}
                style={{flex:2, padding:"13px", background:C.blue, border:"none", borderRadius:10, fontFamily:"inherit", fontSize:14, fontWeight:700, cursor:"pointer", color:"#fff"}}>
                ✓ Confirmer la signature
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

  const [showMoveModal, setShowMoveModal] = useState(null); // doc à déplacer
  const [chantiers, setChantiers] = useState(() => {
    try { return JSON.parse(localStorage.getItem("bonna_chantiers") || "[]"); } catch { return []; }
  });

  // Charger les chantiers depuis Supabase
  useEffect(() => {
    if (!SUPABASE_URL || !SUPABASE_KEY) return;
    sbFetch("/chantiers?order=nom.asc&limit=200")
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        if (rows.length > 0) {
          const noms = rows.map(r => r.nom);
          setChantiers(noms);
          localStorage.setItem("bonna_chantiers", JSON.stringify(noms));
        }
      }).catch(()=>{});
  }, []);

  const saveChantiers = async (list) => {
    setChantiers(list);
    localStorage.setItem("bonna_chantiers", JSON.stringify(list));
    // Sync Supabase — on remplace toute la liste
    if (SUPABASE_URL && SUPABASE_KEY) {
      try {
        // Supprimer tous puis réinsérer
        await sbFetch("/chantiers?nom=neq.___", { method: "DELETE", prefer: "return=minimal" });
        if (list.length > 0) {
          await sbFetch("/chantiers", {
            method: "POST", prefer: "return=minimal",
            body: JSON.stringify(list.map(nom => ({ nom })))
          });
        }
      } catch(e) { console.error("Sync chantiers error:", e); }
    }
  };

  const icons  = { securite:"🤿", notice:"📋", accueil:"🛡️" };
  const labels = { securite:"Fiche Sécurité", notice:"Notice Poste", accueil:"Accueil QSE" };

  // ── Créer un chantier ──
  const creerChantier = () => {
    const nom = newChantierNom.trim();
    if (!nom || chantiers.includes(nom)) return;
    saveChantiers([...chantiers, nom]);
    setNewChantierNom("");
    setShowNewChantier(false);
  };

  // ── Supprimer un chantier ──
  const supprimerChantier = (nom) => {
    if (!confirm(`Supprimer le dossier "${nom}" ?
Les documents qu'il contient ne seront pas supprimés.`)) return;
    saveChantiers(chantiers.filter(c => c !== nom));
    if (chantierOuvert === nom) setChantierOuvert(null);
  };

  // ── Docs d'un chantier spécifique ──
  const docsChantier = (nom) => docs.filter(d => d.chantier === nom);

  // ── Docs sans chantier assigné ──
  const docsSansChantier = docs.filter(d => !chantiers.includes(d.chantier));

  // ── Déplacer un doc vers un chantier ──
  const deplacerDoc = async (docId, nomChantier) => {
    if (SUPABASE_URL && SUPABASE_KEY) {
      try {
        // Récupérer le doc actuel
        const res = await sbFetch(`/documents?id=eq.${docId}`);
        const rows = await res.json();
        if (rows.length > 0) {
          const doc = rows[0];
          const updatedPayload = { ...doc.payload, chantier: nomChantier };
          await sbFetch(`/documents?id=eq.${docId}`, {
            method: "PATCH", prefer: "return=minimal",
            body: JSON.stringify({ chantier: nomChantier, payload: updatedPayload })
          });
          // Recharger
          const allRes = await sbFetch("/documents?order=saved_at.desc&limit=500");
          const allRows = await allRes.json();
          const parsed = allRows.map(r => ({ ...r.payload, id: r.id, savedAt: r.saved_at }));
          // Mettre à jour le state parent via callback
          window._refreshDocs && window._refreshDocs(parsed);
        }
      } catch(e) { console.error(e); }
    } else {
      const saved = JSON.parse(localStorage.getItem("bonna_docs_v2") || "[]");
      const updated = saved.map(d => d.id === docId ? { ...d, chantier: nomChantier } : d);
      localStorage.setItem("bonna_docs_v2", JSON.stringify(updated));
    }
    setShowMoveModal(null);
  };

  // ── Vue liste filtrée (mode "tous") ──
  const filtered = docs
    .filter(d => filter === "tous" || d.type === filter)
    .sort((a,b) => sortAsc ? a.savedAt.localeCompare(b.savedAt) : b.savedAt.localeCompare(a.savedAt));

  // ── Carte document ──
  const DocCard = ({ doc }) => (
    <div style={s.archiveCard}>
      <div style={s.archiveIcon(doc.type)}>{icons[doc.type]}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {labels[doc.type]}{doc.nom ? " — "+doc.nom : ""}
        </div>
        <div style={{fontSize:10,color:C.gray,marginTop:1,fontFamily:"monospace"}}>
          {doc.chantier} · {doc.date}
        </div>
      </div>
      <div style={{display:"flex",gap:5}}>
        <button style={s.iconBtn} title="Déplacer" onClick={()=>setShowMoveModal(doc)}>📁</button>
        <button style={s.iconBtn} onClick={()=>onEdit(doc)}>✏️</button>
        <button style={s.iconBtn} onClick={()=>onExportPDF(doc)}>📄</button>
        <button style={{...s.iconBtn,color:C.danger}} onClick={()=>onDelete(doc.id)}>🗑</button>
      </div>
    </div>
  );

  return (
    <div style={s.view}>

      {/* ── Header ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:700}}>
          {chantierOuvert ? (
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <button onClick={()=>setChantierOuvert(null)}
                style={{background:"none",border:"none",cursor:"pointer",fontSize:18,lineHeight:1,padding:0,color:C.blue}}>
                ←
              </button>
              📁 {chantierOuvert}
            </span>
          ) : "Documents"}
        </div>
        <div style={{display:"flex",gap:6}}>
          {!chantierOuvert && (
            <>
              <button
                onClick={()=>setView(v=>v==="chantiers"?"tous":"chantiers")}
                style={{background:C.white,border:`1.5px solid ${C.grayLight}`,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:600,color:view==="chantiers"?C.blueMid:C.gray}}>
                {view==="chantiers" ? "📋 Liste" : "📁 Chantiers"}
              </button>
              {view==="tous" && (
                <button onClick={()=>setSortAsc(p=>!p)}
                  style={{background:C.white,border:`1.5px solid ${C.grayLight}`,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                  ⇅ {sortAsc?"Date ↑":"Date ↓"}
                </button>
              )}
            </>
          )}
        </div>
      </div>

      {/* ══════════ VUE CHANTIERS ══════════ */}
      {!chantierOuvert && view === "chantiers" && (
        <>
          {/* Bouton créer chantier */}
          {!showNewChantier ? (
            <button onClick={()=>setShowNewChantier(true)} style={{
              width:"100%", padding:"12px", marginBottom:12,
              background:C.white, border:`2px dashed ${C.blueMid}`,
              borderRadius:10, cursor:"pointer", color:C.blueMid,
              fontFamily:"inherit", fontSize:13, fontWeight:600,
              display:"flex", alignItems:"center", justifyContent:"center", gap:6
            }}>
              ＋ Créer un dossier chantier
            </button>
          ) : (
            <div style={{background:C.white,borderRadius:10,padding:12,marginBottom:12,boxShadow:s.card.boxShadow}}>
              <label style={s.label}>Nom du chantier</label>
              <div style={{display:"flex",gap:8,marginTop:4}}>
                <input
                  value={newChantierNom}
                  onChange={e=>setNewChantierNom(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&creerChantier()}
                  placeholder="Ex : Port de Bordeaux, Chantier Lyon…"
                  autoFocus
                  style={{...s.input,flex:1}}
                />
                <button onClick={creerChantier}
                  style={{background:C.blue,color:"#fff",border:"none",borderRadius:7,padding:"8px 14px",fontFamily:"inherit",fontWeight:700,cursor:"pointer",fontSize:13}}>
                  Créer
                </button>
                <button onClick={()=>{setShowNewChantier(false);setNewChantierNom("");}}
                  style={{background:C.bg,border:`1.5px solid ${C.grayLight}`,borderRadius:7,padding:"8px 10px",fontFamily:"inherit",cursor:"pointer",fontSize:13}}>
                  ✕
                </button>
              </div>
            </div>
          )}

          {/* Liste des dossiers chantiers */}
          {chantiers.length === 0 && docsSansChantier.length === 0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:C.gray}}>
              <div style={{fontSize:40,marginBottom:10}}>📂</div>
              <p style={{fontSize:13}}>Aucun document enregistré.<br/>Créez un dossier chantier pour commencer.</p>
            </div>
          ) : (
            <>
              {chantiers.map(nom => {
                const nb = docsChantier(nom).length;
                return (
                  <div key={nom} style={{
                    background:C.white, borderRadius:10,
                    boxShadow:"0 2px 12px rgba(26,58,110,0.08)",
                    marginBottom:9, overflow:"hidden"
                  }}>
                    <div
                      onClick={()=>setChantierOuvert(nom)}
                      style={{
                        display:"flex", alignItems:"center", gap:12,
                        padding:"13px 14px", cursor:"pointer",
                      }}
                    >
                      <div style={{
                        width:42, height:42, borderRadius:10,
                        background:C.blueLight,
                        display:"flex", alignItems:"center", justifyContent:"center",
                        fontSize:22, flexShrink:0,
                      }}>📁</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:14,color:C.text}}>{nom}</div>
                        <div style={{fontSize:11,color:C.gray,marginTop:1}}>
                          {nb} document{nb!==1?"s":""}</div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <button
                          onClick={e=>{e.stopPropagation();supprimerChantier(nom);}}
                          style={{...s.iconBtn,color:C.danger}}
                          title="Supprimer le dossier">🗑</button>
                        <span style={{color:C.gray,fontSize:18}}>›</span>
                      </div>
                    </div>
                    {/* Mini-aperçu des 2 derniers docs */}
                    {nb > 0 && (
                      <div style={{borderTop:`1px solid ${C.grayLight}`,padding:"6px 14px 8px"}}>
                        {docsChantier(nom).slice(-2).reverse().map(doc=>(
                          <div key={doc.id} style={{display:"flex",alignItems:"center",gap:7,padding:"3px 0",fontSize:11}}>
                            <span>{icons[doc.type]}</span>
                            <span style={{color:C.text,fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                              {labels[doc.type]}{doc.nom?" — "+doc.nom:""}
                            </span>
                            <span style={{color:C.gray,fontFamily:"monospace",fontSize:10,flexShrink:0}}>{doc.date}</span>
                          </div>
                        ))}
                        {nb > 2 && <div style={{fontSize:10,color:C.gray,textAlign:"center",marginTop:2}}>+{nb-2} autre{nb-2>1?"s":""}</div>}
                      </div>
                    )}
                  </div>
                );
              })}

              {/* Docs sans dossier */}
              {docsSansChantier.length > 0 && (
                <>
                  <div style={{fontSize:11,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:0.5,margin:"12px 0 8px"}}>
                    Sans dossier ({docsSansChantier.length})
                  </div>
                  {docsSansChantier.map(doc=><DocCard key={doc.id} doc={doc} />)}
                </>
              )}
            </>
          )}
        </>
      )}

      {/* ══════════ VUE CONTENU CHANTIER ══════════ */}
      {chantierOuvert && (
        <>
          <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
            {["tous","securite","notice","accueil"].map(f=>(
              <button key={f} style={s.filterChip(filter===f)} onClick={()=>setFilter(f)}>
                {f==="tous"?"Tous":labels[f]}
              </button>
            ))}
          </div>
          {(() => {
            const docsF = docsChantier(chantierOuvert)
              .filter(d=>filter==="tous"||d.type===filter)
              .sort((a,b)=>b.savedAt.localeCompare(a.savedAt));
            return docsF.length === 0 ? (
              <div style={{textAlign:"center",padding:"36px 20px",color:C.gray}}>
                <div style={{fontSize:36,marginBottom:8}}>📄</div>
                <p style={{fontSize:13}}>Aucun document dans ce dossier.<br/>
                Sauvegardez un formulaire avec le chantier "<strong>{chantierOuvert}</strong>",<br/>
                ou déplacez un document existant ici via 📁.</p>
              </div>
            ) : docsF.map(doc=><DocCard key={doc.id} doc={doc} />);
          })()}
        </>
      )}

      {/* ══════════ VUE TOUS LES DOCS ══════════ */}
      {!chantierOuvert && view === "tous" && (
        <>
          <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
            {["tous","securite","notice","accueil"].map(f=>(
              <button key={f} style={s.filterChip(filter===f)} onClick={()=>setFilter(f)}>
                {f==="tous"?"Tous":labels[f]}
              </button>
            ))}
          </div>
          {filtered.length===0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:C.gray}}>
              <div style={{fontSize:36,marginBottom:10}}>📂</div>
              <p style={{fontSize:13}}>Aucun document enregistré.</p>
            </div>
          ) : filtered.map(doc=><DocCard key={doc.id} doc={doc} />)}
        </>
      )}

      {/* ══════════ MODALE DÉPLACER ══════════ */}
      {showMoveModal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:400,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:C.white,borderRadius:"16px 16px 0 0",width:"100%",padding:"20px 16px 36px",animation:"slideUp .25s ease"}}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>📁 Déplacer vers un dossier</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:16}}>
              {labels[showMoveModal.type]}{showMoveModal.nom?" — "+showMoveModal.nom:""}
            </div>
            {chantiers.length === 0 ? (
              <div style={{color:C.gray,fontSize:13,textAlign:"center",padding:"16px 0"}}>
                Aucun dossier créé. Créez d'abord un dossier chantier.
              </div>
            ) : chantiers.map(nom=>(
              <div key={nom}
                onClick={()=>deplacerDoc(showMoveModal.id, nom)}
                style={{
                  display:"flex",alignItems:"center",gap:10,
                  padding:"12px 14px",borderRadius:10,marginBottom:7,
                  background: showMoveModal.chantier===nom ? C.blueLight : C.bg,
                  border:`1.5px solid ${showMoveModal.chantier===nom ? C.blueMid : C.grayLight}`,
                  cursor:"pointer",
                }}
              >
                <span style={{fontSize:20}}>📁</span>
                <span style={{fontWeight:600,fontSize:13,flex:1}}>{nom}</span>
                <span style={{fontSize:11,color:C.gray}}>{docsChantier(nom).length} doc{docsChantier(nom).length!==1?"s":""}</span>
                {showMoveModal.chantier===nom && <span style={{color:C.blueMid,fontWeight:700}}>✓</span>}
              </div>
            ))}
            <button onClick={()=>setShowMoveModal(null)}
              style={{width:"100%",marginTop:8,padding:"12px",background:C.bg,border:`1.5px solid ${C.grayLight}`,borderRadius:10,fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer",color:C.gray}}>
              Annuler
            </button>
          </div>
        </div>
      )}

    </div>
  );
}

// ─── VUE PÉNIBILITÉ ──────────────────────────────────────────────────────────
function VuePenibilite({ docs }) {
  const [expanded, setExpanded] = useState({});

  const plongees = docs.filter(d=>d.type==="securite").flatMap(fiche=>
    (fiche.data.operateurs||[]).flatMap(op=>{
      const prof=parseFloat(op.prof);
      if(!op.equipe||isNaN(prof)||prof<=12) return [];
      return [{nom:op.equipe,profondeur:prof,tpsFond:parseFloat(op.tpsFond)||null,duree:parseFloat(op.duree)||null,date:fiche.data.date||fiche.date||"—",site:fiche.data.site||fiche.chantier||"—",methode:fiche.data.methode||""}];
    })
  );

  const total = plongees.length;
  const profMoy = total ? (plongees.reduce((s,p)=>s+p.profondeur,0)/total).toFixed(1) : "—";
  const byNom = {};
  plongees.forEach(p=>{ if(!byNom[p.nom]) byNom[p.nom]=[]; byNom[p.nom].push(p); });
  const nbAlert = Object.values(byNom).filter(a=>a.length>=60).length;

  const exportCSV = () => {
    if (!total) { alert("Aucune donnée à exporter"); return; }
    // ── SheetJS xlsx ──
    const XLSX = window.XLSX_LIB;
    if (XLSX) {
      const wb = XLSX.utils.book_new();
      // Feuille 1 — Registre
      const rows1 = [
        ["BONNA TP — DOSSIER PÉNIBILITÉ PLONGEURS"],
        [`Exporté le : ${new Date().toLocaleDateString("fr-FR")}`],
        [],
        ["N°","Nom du plongeur","Date","Site / Chantier","Profondeur (m)","Temps fond (min)","Durée totale (min)","Méthode"],
        ...plongees.map((p,i) => [i+1, p.nom, p.date, p.site, p.profondeur, p.tpsFond||"", p.duree||"", p.methode||""]),
        [],
        ["TOTAL PLONGÉES > 12m :", total],
      ];
      const ws1 = XLSX.utils.aoa_to_sheet(rows1);
      ws1["!cols"] = [{wch:4},{wch:20},{wch:12},{wch:22},{wch:13},{wch:16},{wch:16},{wch:14}];
      XLSX.utils.book_append_sheet(wb, ws1, "Registre >12m");
      // Feuille 2 — Synthèse
      const rows2 = [
        ["SYNTHÈSE PAR PLONGEUR"],
        [],
        ["Nom","Nb plongées >12m","Prof. moy. (m)","Tps fond total (min)","Seuil annuel","Statut C2P"],
        ...Object.entries(byNom).map(([n,a]) => {
          const nb=a.length, pm=(a.reduce((s,x)=>s+x.profondeur,0)/nb).toFixed(1), tt=a.reduce((s,x)=>s+(x.tpsFond||0),0);
          return [n, nb, parseFloat(pm), tt, 60, nb>=60?"⚠ SEUIL ATTEINT":nb>=48?"→ Proche":"✓ OK"];
        }),
      ];
      const ws2 = XLSX.utils.aoa_to_sheet(rows2);
      ws2["!cols"] = [{wch:20},{wch:16},{wch:14},{wch:20},{wch:12},{wch:18}];
      XLSX.utils.book_append_sheet(wb, ws2, "Synthèse par plongeur");
      XLSX.writeFile(wb, `Penibilite_BONNATP_${new Date().toISOString().slice(0,10)}.xlsx`);
    } else {
      // Fallback CSV si SheetJS non dispo
      let csv = "\uFEFF";
      csv += "BONNA TP — DOSSIER PÉNIBILITÉ\n";
      csv += "Nom;Profondeur (m);Temps fond (min);Durée (min);Date;Site;Méthode\n";
      plongees.forEach(p => { csv += `${p.nom};${p.profondeur};${p.tpsFond||""};${p.duree||""};${p.date};${p.site};${p.methode}\n`; });
      csv += `\nTOTAL;${total}\n`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8;"}));
      a.download = `Penibilite_BONNATP_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
  };

  const exportPDF = () => {
    if (!total) { alert("Aucune donnée à exporter"); return; }
    const date = new Date().toLocaleDateString("fr-FR");
    const pm = (plongees.reduce((s,p)=>s+p.profondeur,0)/plongees.length).toFixed(1);
    const rows = plongees.map((p,i) =>
      `<tr><td>${i+1}</td><td><b>${p.nom}</b></td><td>${p.date}</td><td>${p.site}</td>
      <td style="text-align:center;${p.profondeur>20?"color:#e85d1a;font-weight:bold":""}">${p.profondeur}</td>
      <td style="text-align:center">${p.tpsFond||"—"}</td><td style="text-align:center">${p.duree||"—"}</td>
      <td>${p.methode||"—"}</td></tr>`).join("");
    const synthRows = Object.entries(byNom).map(([n,a]) => {

      const st=nb>=60?"⚠ SEUIL ATTEINT":nb>=48?"→ Proche":"✓ OK";

      .tr-tot td{background:#1a3a6e!important;color:#fff!important;font-weight:bold!important}
      .info{background:#e8eef8;border-left:3px solid #2356a8;padding:7px 9px;font-size:9px;margin-top:10px}

      </style></head><body>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        <div style="background:#e85d1a;color:#fff;font-weight:bold;padding:3px 9px;font-size:12px">BONNA TP</div>

      </div>
      <h1>DOSSIER PÉNIBILITÉ PLONGEURS — Facteur C2P</h1>
      <div class="stats">

        <div class="stat"><div class="sv">${pm}m</div><div class="sl">Prof. moyenne</div></div>
        <div class="stat"><div class="sv">${nbAlert}</div><div class="sl">Seuil atteint</div></div>
      </div>
      <h2>SYNTHÈSE PAR PLONGEUR</h2>
      <table><thead><tr><th>Nom</th><th>Nb &gt;12m</th><th>Prof.moy(m)</th>

      <tbody>${rows}
      <tr class="tr-tot"><td colspan="4" style="text-align:right">TOTAL :</td>
        <td colspan="4">${total} plongée${total>1?"s":""}</td></tr>
      </tbody></table>
      <div class="info">⚖ Décret n°2015-1888 — Seuil 60 interventions/an. À transmettre à la médecine du travail.</div>
      <div class="note">📱 iPhone : Partager → Imprimer ou Enregistrer en PDF</div>
    </body></html>`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
    a.download = `Penibilite_BONNATP_${new Date().toISOString().slice(0,10)}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  return (
    <div style={s.view}>
      <div style={s.infoBanner}>
        <strong>⚖ Facteur de pénibilité C2P — Travaux subaquatiques</strong><br/>
        Seuil : <strong>60 plongées/an à profondeur &gt; 12 m</strong> (décret n°2015-1888).<br/>
        Se remplit automatiquement depuis les Fiches de Sécurité sauvegardées.
      </div>

      <div style={s.statGrid}>
        {[[total,"Total plongées >12m","seuil : 60/an",C.accent],[Object.keys(byNom).length,"Plongeurs exposés","actifs",C.blueMid],[total?profMoy+"m":"—","Prof. moyenne","mètres",C.success],[nbAlert,"Seuil atteint","plongeur(s)",C.danger]].map(([v,l,sub,color],i)=>(
          <div key={i} style={s.statCard(color)}>
            <div style={s.statLabel}>{l}</div>
            <div style={s.statVal}>{v}</div>
            <div style={s.statSub(color)}>{sub}</div>
          </div>
        ))}
      </div>

      <div style={s.sectionTitle}><span style={{display:"block",width:4,height:16,background:C.accent,borderRadius:2}}></span>Synthèse par plongeur</div>

      {total===0 ? (
        <div style={{textAlign:"center",padding:"28px 20px",color:C.gray,fontSize:13}}>
          <div style={{fontSize:36,marginBottom:8}}>🤿</div>
          Aucune plongée &gt; 12m trouvée.<br/>Remplissez et sauvegardez des Fiches de Sécurité.
        </div>
      ) : Object.entries(byNom).sort((a,b)=>b[1].length-a[1].length).map(([nom,arr])=>{
        const nb=arr.length, pct=Math.min((nb/60)*100,100), st=nb>=60?"alert":nb>=48?"warn":"ok";
        const stLabel=nb>=60?"⚠ SEUIL ATTEINT":nb>=48?"→ Proche du seuil":"✓ OK";
        const pm=(arr.reduce((s,p)=>s+p.profondeur,0)/nb).toFixed(1);
        const tt=arr.reduce((s,p)=>s+(p.tpsFond||0),0);
        const color=nb>=60?C.danger:nb>=48?C.accent:C.success;
        return (
          <div key={nom} style={{...s.card,marginBottom:10}}>
            <div style={{padding:"11px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontWeight:700,fontSize:14}}>🤿 {nom}</div>
                <div style={s.badge(st)}>{stLabel}</div>
              </div>
              <div style={{fontSize:12,color:C.gray,marginBottom:3}}>
                <span style={{fontFamily:"monospace",fontWeight:700,fontSize:15,color:C.text}}>{nb}</span> / 60 plongées annuelles
              </div>
              <div style={s.progressBar}><div style={s.progressFill(pct,color)}></div></div>
              <div style={{display:"flex",gap:12,fontSize:11,color:C.gray,marginTop:3}}>
                Prof. moy. <strong style={{color:C.text,fontFamily:"monospace"}}>{pm}m</strong>
                &nbsp;·&nbsp; Temps fond tot. <strong style={{color:C.text,fontFamily:"monospace"}}>{tt} min</strong>
              </div>
              <button onClick={()=>setExpanded(p=>({...p,[nom]:!p[nom]}))} style={{background:"none",border:"none",cursor:"pointer",color:C.blueMid,fontSize:11,fontWeight:700,padding:"5px 0 0",fontFamily:"inherit"}}>
                {expanded[nom]?"▾":"▸"} Voir les {nb} plongée{nb>1?"s":""} détaillées
              </button>
              {expanded[nom] && (
                <div style={{marginTop:6}}>
                  {arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((p,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:`1px solid ${C.grayLight}`,fontSize:12}}>
                      <div style={{background:p.profondeur>20?"#fff3e8":C.blueLight,color:p.profondeur>20?C.accent:C.blueMid,fontFamily:"monospace",fontWeight:700,fontSize:11,padding:"2px 7px",borderRadius:5,flexShrink:0,minWidth:46,textAlign:"center"}}>{p.profondeur}m</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:500}}>{p.site}</div>
                        <div style={{color:C.gray,fontSize:10,fontFamily:"monospace"}}>{p.date}{p.tpsFond?" · "+p.tpsFond+" min fond":""}{p.methode?" · "+p.methode:""}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      })}

      {total>0 && (
        <>
          <div style={s.sectionTitle}><span style={{display:"block",width:4,height:16,background:C.accent,borderRadius:2}}></span>Registre complet</div>
          <div style={s.card}>
            <div style={s.cardHeader}>Toutes les plongées &gt; 12m</div>
            <div style={{...s.cardBody,padding:0,overflowX:"auto"}}>
              <table style={{...s.penibTable,minWidth:480}}>
                <thead><tr>
                  {["N°","Nom du plongeur","Date","Site","Prof.(m)","Tps fond(min)","Durée(min)","Méthode"].map(h=><th key={h} style={s.penibTh}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {plongees.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((p,i)=>(
                    <tr key={i} style={{background:i%2===0?"#fff":C.bg}}>
                      <td style={{...s.penibTd,textAlign:"center"}}>{i+1}</td>
                      <td style={{...s.penibTd,fontWeight:600}}>{p.nom}</td>
                      <td style={{...s.penibTd,textAlign:"center",fontFamily:"monospace",fontSize:10}}>{p.date}</td>
                      <td style={s.penibTd}>{p.site}</td>
                      <td style={{...s.penibTd,textAlign:"center",fontWeight:p.profondeur>20?700:400,color:p.profondeur>20?C.accent:C.text}}>{p.profondeur}</td>
                      <td style={{...s.penibTd,textAlign:"center"}}>{p.tpsFond||"—"}</td>
                      <td style={{...s.penibTd,textAlign:"center"}}>{p.duree||"—"}</td>
                      <td style={s.penibTd}>{p.methode||"—"}</td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr style={{background:C.blue}}>
                    <td colSpan={4} style={{...s.penibTfootTd,textAlign:"right"}}>TOTAL — Plongées &gt; 12m :</td>
                    <td colSpan={4} style={{...s.penibTfootTd,fontSize:14}}>{total} plongée{total>1?"s":""}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </>
      )}

      <div style={{display:"flex",gap:9,marginTop:4}}>
        <button style={{...s.btn("primary"),flex:1}} onClick={exportCSV}>📊 Export Excel / CSV</button>
        <button style={{...s.btn("secondary"),flex:1}} onClick={exportPDF}>📄 Export PDF</button>
      </div>
    </div>
  );
}

// ─── APP PRINCIPALE ───────────────────────────────────────────────────────────
function App() {
  // Charger SheetJS
  useEffect(() => {
    if (window.XLSX_LIB) return;
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.onload = () => { window.XLSX_LIB = window.XLSX || XLSX; };
    document.head.appendChild(script);
  }, []);

  const [tab, setTab] = useState("securite");
  const [securite, setSecurite] = useState(emptySecurite);
  const [notice, setNotice] = useState(emptyNotice);
  const [accueil, setAccueil] = useState(emptyAccueil);
  const [docs, setDocs] = useState(loadDocs);
  const [syncing, setSyncing] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [toast, setToast] = useState("");

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2500); };

  // ── Charger depuis Supabase ──
  const fetchDocs = async () => {
    if (!SUPABASE_URL || !SUPABASE_KEY) return;
    try {
      setSyncing(true);
      const res = await sbFetch("/documents?order=saved_at.desc&limit=500");
      if (!res.ok) return;
      const rows = await res.json();
      const parsed = rows.map(r => ({ ...r.payload, id: r.id, savedAt: r.saved_at }));
      setDocs(parsed);
      saveDocs(parsed); // cache local
      setLastSync(new Date());
    } catch(e) {
      console.error("Sync error:", e);
    } finally {
      setSyncing(false);
    }
  };

  // Charger au démarrage + polling toutes les 30s
  useEffect(() => {
    fetchDocs();
    const interval = setInterval(fetchDocs, 30000);
    return () => clearInterval(interval);
  }, []);

  const showToast2 = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2500); };

  const saveDoc = async (type, data) => {
    const labels={securite:"Fiche Sécurité",notice:"Notice Poste Hyperbare",accueil:"Accueil QSE Renforcé"};
    const newDoc = {
      id: Date.now(),
      type, label: labels[type],
      chantier: data.site||data.chantier||"—",
      date: data.date||data.dateArrivee||new Date().toISOString().slice(0,10),
      nom: data.nom ? `${data.nom} ${data.prenom||""}`.trim() : "",
      data,
      savedAt: new Date().toISOString()
    };

    // Sauvegarder dans Supabase
    if (SUPABASE_URL && SUPABASE_KEY) {
      try {
        await sbFetch("/documents", {
          method: "POST",
          prefer: "return=minimal",
          body: JSON.stringify({
            id: newDoc.id,
            type: newDoc.type,
            chantier: newDoc.chantier,
            date: newDoc.date,
            nom: newDoc.nom,
            saved_at: newDoc.savedAt,
            payload: newDoc
          })
        });
        await fetchDocs(); // recharger pour tous
        showToast("✓ Document sauvegardé et synchronisé");
      } catch(e) {
        // Fallback local
        const updated=[...docs,newDoc];
        saveDocs(updated); setDocs(updated);
        showToast("✓ Sauvegardé localement (hors ligne)");
      }
    } else {
      const updated=[...docs,newDoc];
      saveDocs(updated); setDocs(updated);
      showToast("✓ Document sauvegardé");
    }
  };

  const deleteDoc = async (id) => {
    if(!confirm("Supprimer ce document ?")) return;
    if (SUPABASE_URL && SUPABASE_KEY) {
      try {
        await sbFetch(`/documents?id=eq.${id}`, { method: "DELETE", prefer: "return=minimal" });
        await fetchDocs();
      } catch(e) {
        const updated=docs.filter(d=>d.id!==id);
        saveDocs(updated); setDocs(updated);
      }
    } else {
      const updated=docs.filter(d=>d.id!==id);
      saveDocs(updated); setDocs(updated);
    }
    showToast("Document supprimé");
  };

  const editDoc = (doc) => {
    if(doc.type==="securite") setSecurite({...emptySecurite(),...doc.data,operateurs:(doc.data.operateurs||[]).map(op=>({...emptyOp(),...op}))});
    if(doc.type==="notice") setNotice({...emptyNotice(),...doc.data});
    if(doc.type==="accueil") setAccueil({...emptyAccueil(),...doc.data});
    setTab(doc.type);
    showToast("Formulaire chargé — modifiez puis resauvegardez");
  };

  // ── télécharge un blob HTML → ouvrir dans Safari → Partager → Imprimer
  const dlBlob = (content, filename, mime) => {
    const blob = new Blob([content], { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const genPDF = (type, data) => {
    const date = new Date().toLocaleDateString("fr-FR");
    const css = `body{font-family:Arial,sans-serif;font-size:11px;padding:15px;margin:0}
      h1{font-size:14px;text-align:center;border-bottom:2px solid #1a3a6e;padding-bottom:5px;color:#1a3a6e;margin-bottom:8px}
      h2{font-size:11px;background:#1a3a6e;color:#fff;padding:5px 9px;margin:10px 0 5px}
      table{width:100%;border-collapse:collapse;margin-bottom:9px}
      th{background:#e8eef8;font-size:9px;padding:4px 6px;border:1px solid #ccc;text-align:left}
      td{border:1px solid #ccc;padding:4px 6px;font-size:10px}
      .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .f{display:flex;margin-bottom:4px;gap:6px;font-size:11px}
      .f b{min-width:130px;flex-shrink:0}
      .f span{border-bottom:1px solid #bbb;flex:1;padding-left:3px}
      .logo{display:flex;align-items:center;gap:9px;margin-bottom:8px}
      .logo-box{background:#e85d1a;color:#fff;font-weight:bold;padding:3px 9px;font-size:12px}
      .note{background:#e8eef8;border-left:3px solid #2356a8;padding:6px 9px;font-size:10px;margin-top:8px;font-style:italic}
      @media print{@page{margin:10mm}}`;

    let body = "";
    if (type === "securite") {
      const ops = (data.operateurs||[]).map((op,i) =>
        `<tr><td>OP${i+1}</td><td>${op.equipe||""}</td><td>${op.heureImm||""}</td>
        <td>${op.prof||""}</td><td>${op.tpsFond||""}</td>
        <td>${op.p12||""}</td><td>${op.p9||""}</td><td>${op.p6||""}</td><td>${op.p3||""}</td>
        <td>${op.sortie||""}</td><td>${op.duree||""}</td></tr>`).join("");
      body = `<h1>FICHE DE SÉCURITÉ</h1>
        <div class="g2">
          <div class="f"><b>Date :</b><span>${data.date||""}</span></div>
          <div class="f"><b>Site :</b><span>${data.site||""}</span></div>
          <div class="f"><b>Semaine N° :</b><span>${data.semaine||""}</span></div>
          <div class="f"><b>Plongée N° :</b><span>${data.plongeeNum||""}</span></div>
          <div class="f"><b>Méthode :</b><span>${data.methode||""}</span></div>
          <div class="f"><b>Classe :</b><span>${data.classe||""}</span></div>
          <div class="f"><b>Mélange :</b><span>${data.melange||""}</span></div>
          <div class="f"><b>Support :</b><span>${data.support||""}</span></div>
          <div class="f"><b>État mer :</b><span>${data.etatMer||""}</span></div>
          <div class="f"><b>T° eau :</b><span>${data.tempEau||""} °C</span></div>
          <div class="f"><b>Vent :</b><span>${data.vent||""} Bf</span></div>
          <div class="f"><b>Visibilité :</b><span>${data.visibilite||""} m</span></div>
        </div>
        <h2>Équipe — Données de plongée</h2>
        <table><thead><tr><th>OP</th><th>Équipe</th><th>H.imm.</th><th>Prof.</th>
          <th>Tps fond</th><th>12m</th><th>9m</th><th>6m</th><th>3m</th>
          <th>H.sortie</th><th>Durée</th></tr></thead>
          <tbody>${ops}</tbody></table>
        <h2>Observations</h2>
        <div style="border:1px solid #ccc;min-height:40px;padding:6px;font-size:11px">${data.observations||""}</div>`;
    } else if (type === "notice") {
      const sigRespHtml = data.sigResponsable
        ? `<img src="${data.sigResponsable}" style="height:60px;display:block;border:1px solid #ccc;border-radius:4px;margin-top:4px" />`
        : `<div style="height:60px;border:1px solid #ccc;border-radius:4px;margin-top:4px;background:#fafafa"></div>`;
      const sigSalHtml = data.sigSalarie
        ? `<img src="${data.sigSalarie}" style="height:60px;display:block;border:1px solid #ccc;border-radius:4px;margin-top:4px" />`
        : `<div style="height:60px;border:1px solid #ccc;border-radius:4px;margin-top:4px;background:#fafafa"></div>`;
      body = `<h1>NOTICE DE POSTE HYPERBARE — 035_QSE_FO</h1>
        <div class="g2">
          <div class="f"><b>Chantier :</b><span>${data.chantier||""}</span></div>
          <div class="f"><b>Date arrivée :</b><span>${data.dateArrivee||""}</span></div>
          <div class="f"><b>Nom :</b><span>${data.nom||""}</span></div>
          <div class="f"><b>Prénom :</b><span>${data.prenom||""}</span></div>
          <div class="f"><b>Poste :</b><span>${data.poste||""}</span></div>
          <div class="f"><b>Type salarié :</b><span>${data.typeSalarie||""}</span></div>
          <div class="f"><b>Profondeur max :</b><span>${data.profondeur||""} m</span></div>
          <div class="f"><b>Type plongée :</b><span>${data.plongeeType||""}</span></div>
          <div class="f"><b>Support :</b><span>${data.supportType||""}</span></div>
          <div class="f"><b>Gaz fond :</b><span>${data.gazFond||""}</span></div>
          <div class="f"><b>Gaz palier :</b><span>${data.gazPalier||""}</span></div>
        </div>
        <h2>Signatures</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px">
          <div>
            <div style="font-size:10px;font-weight:bold;margin-bottom:2px">Responsable : ${data.respNom||""}</div>
            <div style="font-size:9px;color:#888;margin-bottom:2px">Date : ${data.dateSign||""}</div>
            ${sigRespHtml}
          </div>
          <div>
            <div style="font-size:10px;font-weight:bold;margin-bottom:2px">Salarié : ${data.salNom||""}</div>
            <div style="font-size:9px;color:#888;margin-bottom:2px">&nbsp;</div>
            ${sigSalHtml}
          </div>
        </div>
        <div class="f" style="margin-top:6px"><b>Commentaires :</b><span>${data.commentaires||""}</span></div>`;
    } else {
      body = `<h1>ACCUEIL QSE RENFORCÉ — 043_QSE_FO</h1>
        <div class="g2">
          <div class="f"><b>Chantier :</b><span>${data.chantier||""}</span></div>
          <div class="f"><b>Date :</b><span>${data.date||""}</span></div>
          <div class="f"><b>Nom :</b><span>${data.nom||""}</span></div>
          <div class="f"><b>Prénom :</b><span>${data.prenom||""}</span></div>
          <div class="f"><b>Type salarié :</b><span>${data.typeSalarie||""}</span></div>
          <div class="f"><b>Chef chantier :</b><span>${data.chefNom||""}</span></div>
          <div class="f"><b>Date accueil :</b><span>${data.dateSign||""}</span></div>
          <div class="f"><b>Date évaluation :</b><span>${data.dateEval||""}</span></div>
          <div class="f"><b>Reconduction :</b><span>${data.continuer||""}</span></div>
        </div>`;
    }

    const labels = {securite:"Fiche_Securite",notice:"Notice_Poste_Hyperbare",accueil:"Accueil_QSE_Renforce"};
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
      <title>${labels[type]}</title><style>${css}</style></head>
      <body>
        <div class="logo">
          <span class="logo-box">BONNA TP</span>
          <span style="color:#888;font-size:10px">${date}</span>
        </div>
        ${body}
        <div class="note">📱 Sur iPhone : appuyez sur le bouton Partager → Imprimer, ou Enregistrer en PDF</div>
      </body></html>`;

    dlBlob(html, `${labels[type]}_${data.date||date.replace(/\//g,"-")}.html`, "text/html;charset=utf-8");
    showToast("✓ Fichier téléchargé — ouvrez-le et utilisez Imprimer pour créer le PDF");
  };

  const tabs=[{id:"securite",num:"FO-SEC",label:"Fiche Sécurité"},{id:"notice",num:"035_QSE",label:"Notice Poste"},{id:"accueil",num:"043_QSE",label:"Accueil QSE"},{id:"archive",num:"ARCHIVE",label:"Documents"},{id:"penibilite",num:"C2P",label:"Pénibilité"}];

  return (
    <div style={s.app}>
      <div style={s.header}>
        <div style={s.logoRow}>
          <span style={s.logoBox}>BONNA TP</span>
          <span style={s.appTitle}>Formulaires Terrain</span>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={s.appSub}>Gestion sécurité hyperbare</div>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          {syncing ? (
            <span style={{fontSize:9,color:"rgba(255,255,255,0.6)",fontFamily:"monospace"}}>↻ sync…</span>
          ) : lastSync ? (
            <span style={{fontSize:9,color:"rgba(255,255,255,0.4)",fontFamily:"monospace",cursor:"pointer"}} onClick={fetchDocs}>
              ✓ {lastSync.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
            </span>
          ) : null}
        </div>
      </div>
      </div>

      <div style={s.tabBar}>
        {tabs.map(t=>(
          <button key={t.id} style={s.tabBtn(tab===t.id)} onClick={()=>setTab(t.id)}>
            <span style={s.tabNum(tab===t.id)}>{t.num}</span>{t.label}
          </button>
        ))}
      </div>

      {tab==="securite" && <VueSecurite data={securite} setData={setSecurite} onSave={()=>saveDoc("securite",securite)} onExportPDF={()=>genPDF("securite",securite)} />}
      {tab==="notice" && <VueNotice data={notice} setData={setNotice} onSave={()=>saveDoc("notice",notice)} onExportPDF={()=>genPDF("notice",notice)} />}
      {tab==="accueil" && <VueAccueil data={accueil} setData={setAccueil} onSave={()=>saveDoc("accueil",accueil)} onExportPDF={()=>genPDF("accueil",accueil)} />}
      {tab==="archive" && <VueArchive docs={docs} onDelete={deleteDoc} onEdit={editDoc} onExportPDF={(doc)=>genPDF(doc.type,doc.data)} />}
      {tab==="penibilite" && <VuePenibilite docs={docs} />}

      <Toast message={toast} />
    </div>
  );
}


// Monter l'app
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
document.getElementById("loading").style.display = "none";
</script>
