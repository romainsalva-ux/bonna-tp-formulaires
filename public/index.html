// Calcule le numéro de semaine ISO 8601 à partir d'une date "YYYY-MM-DD"
function getISOWeek(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return "";
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  const week = 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
  return String(week);
}

const getSupabaseUrl = () => {

const sbFetch = (path, opts={}) => {
  const headers = {
    "apikey": getSupabaseKey(),
    "Authorization": "Bearer " + getSupabaseKey(),
    "Content-Type": "application/json",
  };
  // Ajouter Prefer seulement si explicitement passé ou pour GET/POST
  const method = (opts.method || "GET").toUpperCase();
  if (opts.prefer) {
    headers["Prefer"] = opts.prefer;
  } else if (method === "GET" || method === "POST") {
    headers["Prefer"] = "return=representation";
  }
  return fetch(getSupabaseUrl() + "/rest/v1" + path, {
    ...opts,
    headers: { ...headers, ...(opts.headers||{}) }
  });
};

      <option value="">{placeholder}</option>
      {options.map(o => <option key={o} value={o}>{o}</option>)}

  );
}

{"date":"YYYY-MM-DD ou vide","site":"","semaine":"","plongeeNum":"","methode":"narguilé|scaphandre|recycleur ou vide","classe":"A|B ou vide","melange":"","support":"","etatMer":"","altitude":"","vent":"","houle":"","courant":"","visibilite":"","temps":"","tempEau":"","observations":"","operateurs":[{"nom":"","heureImmersion":"","prof":"","tpsFond":""}]}
Texte: "${text}"`,
      notice:`Réponds UNIQUEMENT en JSON valide :
{"chantier":"","dateArrivee":"YYYY-MM-DD ou vide","dateDepart":"YYYY-MM-DD ou vide","nom":"","prenom":"","poste":"","typeSalarie":"CDI|CDD/Intérimaire|Retour arrêt ou vide","profondeur":"","plongeeType":"Narguilé|Bouteille|Inspection|Dérogation ou vide","supportType":"Quai|Navire ou vide","gazFond":"Air|Mélange ou vide","gazPalier":"Air|Mélange|O2 ou vide","respNom":"","salNom":""}
Texte: "${text}"`,
      accueil:`Réponds UNIQUEMENT en JSON valide :
{"chantier":"","date":"YYYY-MM-DD ou vide","nom":"","prenom":"","typeSalarie":"CDD|Intérimaire|Nouvel embauché|Retour arrêt ou vide","chefNom":"","salNom":""}
Texte: "${text}"`
    };
    try {
      const res = await fetch("/api/analyse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompts[form] })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error((err && err.error) || "Erreur HTTP " + res.status);
      }
      const data = await res.json();
      const raw = (data.text || "{}").replace(/```json|```/g, "").trim();
      onFill(JSON.parse(raw));
      setStatus({ msg: "✓ Formulaire rempli avec succès !", type: "success" });
      setText("");
      setTimeout(() => setStatus({ msg: "", type: "" }), 3000);
    } catch(e) {
      setStatus({ msg: "⚠ " + (e.message || "Erreur de connexion"), type: "error" });
    }
    setLoading(false);
  };

  return (
    <div style={s.aiBanner}>
      <div style={s.aiTitle}><span style={{color:C.accent}}>⬡</span> REMPLISSAGE ASSISTÉ PAR IA</div>
      <div style={s.aiRow}>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder={form==="securite"?"Ex : Site Bordeaux, narguilé, 15m, OP1 Jean Dupont…" : form==="notice"?"Ex : Chantier Lyon, Jean Dupont, CDI, arrivée 10/06/2025…" : "Ex : Marie Martin, CDD, chantier Paris…"}
          style={s.aiInput} />
        <button onClick={send} disabled={loading} style={{...s.aiBtn, opacity:loading?0.7:1}}>
          {loading ? "…" : "➤"}
        </button>
      </div>
      {status.msg && <div style={s.aiFeedback(status.type)}>{status.msg}</div>}
    </div>
  );
}

// ─── SIGNATURE PAD ───────────────────────────────────────────────────────────
function SignaturePad({ label, value, onChange }) {
  const [open, setOpen] = useState(false);
  const [isEmpty, setIsEmpty] = useState(!value);
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const lastPos = useRef(null);

  // Initialiser le canvas quand la modale s'ouvre
  useEffect(() => {
    if (!open) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (value) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = value;
    }
  }, [open]);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY,
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    drawing.current = true;
    const pos = getPos(e, canvasRef.current);
    lastPos.current = pos;
    const ctx = canvasRef.current.getContext("2d");
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = "#1a3a6e";
    ctx.fill();
    setIsEmpty(false);
  };

  const draw = (e) => {
    e.preventDefault();
    if (!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const pos = getPos(e, canvas);
    ctx.beginPath();
    ctx.moveTo(lastPos.current.x, lastPos.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = "#1a3a6e";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    lastPos.current = pos;
  };

  const stopDraw = () => { drawing.current = false; };

  const clear = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    setIsEmpty(true);
  };

  const confirm = () => {
    if (canvasRef.current) {
      const data = isEmpty ? "" : canvasRef.current.toDataURL("image/png");
      onChange(data);
    }
    setOpen(false);
  };

  const cancel = () => setOpen(false);

  return (
    <>
      {/* Aperçu compact — clic pour ouvrir */}
      <div style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <label style={s.label}>{label}</label>
          {value && (
            <button onClick={()=>{onChange(""); setIsEmpty(true);}}
              style={{background:"none",border:"none",color:C.danger,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",padding:"2px 6px"}}>
              ✕ Effacer
            </button>
          )}
        </div>
        <div
          onClick={() => setOpen(true)}
          style={{
            border:`2px solid ${value ? C.blueMid : C.grayLight}`,
            borderRadius:9, background:"#fff", height:72,
            display:"flex", alignItems:"center", justifyContent:"center",
            cursor:"pointer", overflow:"hidden", position:"relative",
          }}
        >
          {value ? (
            <img src={value} style={{width:"100%",height:"100%",objectFit:"contain"}} alt="signature" />
          ) : (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:C.gray}}>
              <span style={{fontSize:22}}>✍</span>
              <span style={{fontSize:11,fontStyle:"italic"}}>Appuyez pour signer</span>
            </div>
          )}
        </div>
      </div>

      {/* Modale plein écran pour signer */}
      {open && (
        <div style={{
          position:"fixed", inset:0, zIndex:600,
          background:"rgba(0,0,0,0.7)",
          display:"flex", flexDirection:"column",
        }}>
          {/* Header modale */}
          <div style={{
            background:C.blue, padding:"14px 16px",
            display:"flex", alignItems:"center", justifyContent:"space-between",
            flexShrink:0,
          }}>
            <div>
              <div style={{color:"#fff",fontWeight:700,fontSize:15}}>{label}</div>
              <div style={{color:"rgba(255,255,255,0.55)",fontSize:11,marginTop:1}}>Signez dans la zone ci-dessous</div>
            </div>
            <button onClick={cancel} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"#fff",padding:"7px 14px",fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer"}}>
              Annuler
            </button>
          </div>

          {/* Zone de signature — occupe tout l'espace disponible */}
          <div style={{flex:1, background:"#f0f4ff", display:"flex", flexDirection:"column", padding:12, gap:10, overflow:"hidden"}}>
            <div style={{
              flex:1, background:"#fff",
              borderRadius:12, border:`2px dashed ${C.blueMid}`,
              position:"relative", overflow:"hidden", touchAction:"none",
            }}>
              {isEmpty && (
                <div style={{
                  position:"absolute", inset:0, pointerEvents:"none",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  flexDirection:"column", gap:8,
                }}>
                  <span style={{fontSize:40, opacity:0.2}}>✍</span>
                  <span style={{fontSize:13, color:C.gray, fontStyle:"italic"}}>Tracez votre signature ici</span>
                </div>
              )}
              <canvas
                ref={canvasRef}
                width={900}
                height={400}
                style={{display:"block", width:"100%", height:"100%", touchAction:"none", cursor:"crosshair"}}
                onMouseDown={startDraw}
                onMouseMove={draw}
                onMouseUp={stopDraw}
                onMouseLeave={stopDraw}
                onTouchStart={startDraw}
                onTouchMove={draw}
                onTouchEnd={stopDraw}
              />
            </div>

            {/* Actions */}
            <div style={{display:"flex", gap:10, flexShrink:0}}>
              <button onClick={clear}
                style={{flex:1, padding:"13px", background:"#fff", border:`1.5px solid ${C.grayLight}`, borderRadius:10, fontFamily:"inherit", fontSize:13, fontWeight:600, cursor:"pointer", color:C.danger}}>
                🗑 Effacer
              </button>
              <button onClick={confirm}
                style={{flex:2, padding:"13px", background:C.blue, border:"none", borderRadius:10, fontFamily:"inherit", fontSize:14, fontWeight:700, cursor:"pointer", color:"#fff"}}>
                ✓ Confirmer la signature
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ─── VUE ARCHIVE ─────────────────────────────────────────────────────────────
function VueArchive({ docs, onDelete, onEdit, onExportPDF }) {
  const [view, setView] = useState("chantiers");
  const [chantierOuvert, setChantierOuvert] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [confirmDeleteChantier, setConfirmDeleteChantier] = useState(null);
  const [filter, setFilter] = useState("tous");
  const [sortAsc, setSortAsc] = useState(false);
  const [showNewChantier, setShowNewChantier] = useState(false);
  const [newChantierNom, setNewChantierNom] = useState("");
  const [showMoveModal, setShowMoveModal] = useState(null);
  const [chantiers, setChantiers] = useState(() => {
    try { return JSON.parse(localStorage.getItem("bonna_chantiers") || "[]"); } catch { return []; }
  });

  const saveChantiers = async (list) => {
    setChantiers(list);
    localStorage.setItem("bonna_chantiers", JSON.stringify(list));
    if (supabaseReady()) {
      try {
        await sbFetch("/chantiers?nom=neq.___", { method: "DELETE", prefer: "return=minimal" });
        if (list.length > 0) {
          await sbFetch("/chantiers", { method: "POST", prefer: "return=minimal", body: JSON.stringify(list.map(nom => ({ nom }))) });
        }
      } catch(e) { console.error("Sync chantiers:", e); }
    }
  };

  const creerChantier = () => {
    const nom = newChantierNom.trim();
    if (!nom || chantiers.includes(nom)) return;
    saveChantiers([...chantiers, nom]);
    setNewChantierNom(""); setShowNewChantier(false);
  };

  supprimerChantier = (nom) => {
    saveChantiers(chantiers.filter(c => c !== nom));
    if (chantierOuvert === nom) setChantierOuvert(null);
  };

  const norm = (s) => (s || "").trim().toLowerCase();
  const docsChantier = (nom) => docs.filter(d => norm(d.chantier) === norm(nom));
  const docsSansChantier = docs.filter(d => !chantiers.some(c => norm(c) === norm(d.chantier)));

  const deplacerDoc = async (docId, nomChantier) => {
    if (supabaseReady()) {
      try {
        const res = await sbFetch("/documents?id=eq." + docId);
        const rows = await res.json();
        if (rows.length > 0) {
          const updatedPayload = { ...rows[0].payload, chantier: nomChantier };
          await sbFetch("/documents?id=eq." + docId, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ chantier: nomChantier, payload: updatedPayload }) });
        }
      } catch(e) { console.error(e); }
    } else {
      const saved = JSON.parse(localStorage.getItem("bonna_docs_v2") || "[]");
      localStorage.setItem("bonna_docs_v2", JSON.stringify(saved.map(d => d.id === docId ? { ...d, chantier: nomChantier } : d)));
    }
    setShowMoveModal(null);
  };

  const icons = { securite: "🤿", notice: "📋", accueil: "🛡️" };
  const labels = { securite: "Fiche Sécurité", notice: "Notice Poste", accueil: "Accueil QSE" };

  const renderDocCard = (doc) => (
    <div key={doc.id} style={s.archiveCard}>
      <div style={s.archiveIcon(doc.type)}>{icons[doc.type]}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {labels[doc.type]}{doc.nom ? " — "+doc.nom : ""}
        </div>
        <div style={{fontSize:10,color:C.gray,marginTop:1,fontFamily:"monospace"}}>
          {doc.chantier} · {doc.date}
        </div>
      </div>
      <div style={{display:"flex",gap:5}}>
        <button style={s.iconBtn} title="Déplacer" onClick={()=>setShowMoveModal(doc)}>📁</button>
        <button style={s.iconBtn} onClick={()=>onEdit(doc)}>✏️</button>
        <button style={s.iconBtn} onClick={()=>onExportPDF(doc)}>📄</button>
        <button style={{...s.iconBtn,color:C.danger}} onClick={()=>setConfirmDeleteId(doc.id)}>🗑</button>
      </div>
    </div>
  );

  const filtered = docs.filter(d=>filter==="tous"||d.type===filter).sort((a,b)=>sortAsc?a.savedAt.localeCompare(b.savedAt):b.savedAt.localeCompare(a.savedAt));

  return (
    <div style={s.view}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:700}}>
          {chantierOuvert ? (
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <button onClick={()=>setChantierOuvert(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,lineHeight:1,padding:0,color:C.blue}}>←</button>
              📁 {chantierOuvert}
            </span>
          ) : "Documents"}
        </div>
        <div style={{display:"flex",gap:6}}>
          {!chantierOuvert && (
            <button onClick={()=>setView(v=>v==="chantiers"?"tous":"chantiers")} style={{background:C.white,border:"1.5px solid "+C.grayLight,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:600,color:view==="chantiers"?C.blueMid:C.gray}}>
              {view==="chantiers" ? "📋 Liste" : "📁 Chantiers"}
            </button>
          )}
        </div>
      </div>

      {!chantierOuvert && view === "chantiers" && (
        <>
          {!showNewChantier ? (
            <button onClick={()=>setShowNewChantier(true)} style={{width:"100%",padding:"12px",marginBottom:12,background:C.white,border:"2px dashed "+C.blueMid,borderRadius:10,cursor:"pointer",color:C.blueMid,fontFamily:"inherit",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              ＋ Créer un dossier chantier
            </button>
          ) : (
            <div style={{background:C.white,borderRadius:10,padding:12,marginBottom:12,boxShadow:s.card.boxShadow}}>
              <label style={s.label}>Nom du chantier</label>
              <div style={{display:"flex",gap:8,marginTop:4}}>
                <input value={newChantierNom} onChange={e=>setNewChantierNom(e.target.value)} onKeyDown={e=>e.key==="Enter"&&creerChantier()} placeholder="Ex : Port de Bordeaux…" autoFocus style={{...s.input,flex:1}}/>
                <button onClick={creerChantier} style={{background:C.blue,color:"#fff",border:"none",borderRadius:7,padding:"8px 14px",fontFamily:"inherit",fontWeight:700,cursor:"pointer",fontSize:13}}>Créer</button>
                <button onClick={()=>{setShowNewChantier(false);setNewChantierNom("");}} style={{background:C.bg,border:"1.5px solid "+C.grayLight,borderRadius:7,padding:"8px 10px",fontFamily:"inherit",cursor:"pointer",fontSize:13}}>✕</button>
              </div>
            </div>
          )}

          {chantiers.length === 0 && docsSansChantier.length === 0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:C.gray}}>
              <div style={{fontSize:40,marginBottom:10}}>📂</div>
              <p style={{fontSize:13}}>Aucun document. Créez un dossier chantier pour commencer.</p>
            </div>
          ) : (
            <>
              {chantiers.filter(nom=>nom&&nom!=="—"&&nom.trim()!=="").map(nom=>{
                const nb=docsChantier(nom).length;
                return (
                  <div key={nom} style={{background:C.white,borderRadius:10,boxShadow:"0 2px 12px rgba(26,58,110,0.08)",marginBottom:9,overflow:"hidden"}}>
                    <div onClick={()=>setChantierOuvert(nom)} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 14px",cursor:"pointer"}}>
                      <div style={{width:42,height:42,borderRadius:10,background:C.blueLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>📁</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:14,color:C.text}}>{nom}</div>
                        <div style={{fontSize:11,color:C.gray,marginTop:1}}>{nb} document{nb!==1?"s":""}</div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <button onClick={e=>{e.stopPropagation();setConfirmDeleteChantier(nom);}} style={{...s.iconBtn,color:C.danger}} title="Supprimer le dossier">🗑</button>
                        <span style={{color:C.gray,fontSize:18}}>›</span>
                      </div>
                    </div>
                    {nb > 0 && (
                      <div style={{borderTop:"1px solid "+C.grayLight,padding:"6px 14px 8px"}}>
                        {docsChantier(nom).slice(-2).reverse().map(doc=>(
                          <div key={doc.id} style={{display:"flex",alignItems:"center",gap:7,padding:"3px 0",fontSize:11}}>
                            <span>{icons[doc.type]}</span>
                            <span style={{color:C.text,fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{labels[doc.type]}{doc.nom?" — "+doc.nom:""}</span>
                            <span style={{color:C.gray,fontFamily:"monospace",fontSize:10,flexShrink:0}}>{doc.date}</span>
                          </div>
                        ))}
                        {nb > 2 && <div style={{fontSize:10,color:C.gray,textAlign:"center",marginTop:2}}>+{nb-2} autre{nb-2>1?"s":""}</div>}
                      </div>
                    )}
                  </div>
                );
              })}
              {docsSansChantier.length > 0 && (
                <>
                  <div style={{fontSize:11,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:0.5,margin:"12px 0 8px"}}>Sans dossier ({docsSansChantier.length})</div>
                  {docsSansChantier.map(doc=>renderDocCard(doc))}
                </>
              )}
            </>
          )}
        </>
      )}

      {chantierOuvert && (
        <>
          <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
            {["tous","securite","notice","accueil"].map(f=>(
              <button key={f} style={s.filterChip(filter===f)} onClick={()=>setFilter(f)}>
                {f==="tous"?"Tous":labels[f]}
              </button>
            ))}
          </div>
          {(()=>{
            const docsF=docsChantier(chantierOuvert).filter(d=>filter==="tous"||d.type===filter).sort((a,b)=>b.savedAt.localeCompare(a.savedAt));
            return docsF.length===0?(
              <div style={{textAlign:"center",padding:"36px 20px",color:C.gray}}>
                <div style={{fontSize:36,marginBottom:8}}>📄</div>
                <p style={{fontSize:13}}>Aucun document dans ce dossier.</p>
              </div>
            ):docsF.map(doc=>renderDocCard(doc));
          })()}
        </>
      )}

      {!chantierOuvert && view === "tous" && (
        <>
          <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}}>
            {["tous","securite","notice","accueil"].map(f=>(
              <button key={f} style={s.filterChip(filter===f)} onClick={()=>setFilter(f)}>
                {f==="tous"?"Tous":labels[f]}
              </button>
            ))}
          </div>
          {filtered.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px",color:C.gray}}>
              <div style={{fontSize:36,marginBottom:10}}>📂</div>
              <p style={{fontSize:13}}>Aucun document.</p>
            </div>
          ):filtered.map(doc=>renderDocCard(doc))}
        </>
      )}

      {confirmDeleteChantier && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:C.white,borderRadius:14,padding:22,width:"100%",maxWidth:340,boxShadow:"0 8px 40px rgba(0,0,0,0.25)"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>Supprimer le dossier ?</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:20,lineHeight:1.5}}><strong>"{confirmDeleteChantier}"</strong><br/>Les documents ne seront pas supprimés.</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfirmDeleteChantier(null)} style={{flex:1,padding:"11px",background:C.bg,border:"1.5px solid "+C.grayLight,borderRadius:9,fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer"}}>Annuler</button>
              <button onClick={()=>{supprimerChantier(confirmDeleteChantier);setConfirmDeleteChantier(null);}} style={{flex:1,padding:"11px",background:C.danger,border:"none",borderRadius:9,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",color:"#fff"}}>🗑 Supprimer</button>
            </div>
          </div>
        </div>
      )}

      {confirmDeleteId && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:C.white,borderRadius:14,padding:22,width:"100%",maxWidth:340,boxShadow:"0 8px 40px rgba(0,0,0,0.25)"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>Supprimer ce document ?</div>

// ─── VUE CARNET PLONGÉE ──────────────────────────────────────────────────────
function VueCarnetPlongee({ docs }) {
  const [openDiver, setOpenDiver] = useState(null);
  const plongees = docs.filter(d=>d.type==="securite").flatMap(fiche=>{
    const data = fiche.data || {};
    return (data.operateurs||[]).flatMap(op=>{
      if (!op.equipe || !op.equipe.trim()) return [];
      const prof = parseFloat(op.prof);
      if (isNaN(prof) || prof<=0) return [];
      return [{
        nom: op.equipe.trim(), date: data.date||fiche.date||"—",
        site: data.site||fiche.chantier||"—", prof,
        duree: op.duree||"", tpsFond: op.tpsFond||"",
        p12: op.p12||"", p9: op.p9||"", p6: op.p6||"", p3: op.p3||"",
        gaz: data.melange||"", methode: data.methode||"",
      }];
    });
  });
  const byNom = {};
  plongees.forEach(p=>{ if(!byNom[p.nom]) byNom[p.nom]=[]; byNom[p.nom].push(p); });
  const divers = Object.keys(byNom).sort();
  const totalMin = (arr) => arr.reduce((s,p)=>{ const d=parseFloat(p.duree); return s+(isNaN(d)?0:d); },0);
  const formatPaliers = (p) => {
    const parts=[];
    if(p.p12) parts.push("12m:"+p.p12);
    if(p.p9) parts.push("9m:"+p.p9);
    if(p.p6) parts.push("6m:"+p.p6);
    if(p.p3) parts.push("3m:"+p.p3);
    return parts.length ? parts.join(" · ") : "—";
  };
  return (
    <div style={s.view}>
      <div style={s.infoBanner}>
        <strong>📘 Carnet de plongée individuel</strong><br/>
        Regroupe automatiquement toutes les plongées enregistrées dans les Fiches de Sécurité.
      </div>
      {divers.length===0 ? (
        <div style={{textAlign:"center",padding:"36px 20px",color:C.gray}}>
          <div style={{fontSize:36,marginBottom:8}}>📘</div>
          <p style={{fontSize:13}}>Aucune plongée enregistrée.</p>
        </div>
      ) : divers.map(nom=>{
        const arr=byNom[nom].slice().sort((a,b)=>b.date.localeCompare(a.date));
        const nb=arr.length, tMin=totalMin(arr), profMax=Math.max(...arr.map(p=>p.prof));
        const open=openDiver===nom;
        return (
          <div key={nom} style={{...s.card,marginBottom:10}}>
            <div onClick={()=>setOpenDiver(open?null:nom)} style={{padding:"12px 14px",cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontWeight:700,fontSize:14}}>🤿 {nom}</div>
                <div style={{color:C.blueMid,fontSize:13}}>{open?"▾":"▸"}</div>
              </div>
              <div style={{display:"flex",gap:14,fontSize:11,color:C.gray,marginTop:5}}>
                <span><strong style={{color:C.text,fontFamily:"monospace",fontSize:13}}>{nb}</strong> plongée{nb>1?"s":""}</span>
                <span>Tps total <strong style={{color:C.text,fontFamily:"monospace"}}>{tMin} min</strong></span>
                <span>Prof. max <strong style={{color:C.text,fontFamily:"monospace"}}>{profMax} m</strong></span>
              </div>
            </div>
            {open && (
              <div style={{borderTop:"1px solid "+C.grayLight,padding:"4px 14px 10px"}}>
                {arr.map((p,i)=>(
                  <div key={i} style={{padding:"8px 0",borderBottom:i<arr.length-1?"1px solid "+C.grayLight:"none"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                      <span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:C.blue}}>{p.date}</span>
                      <span style={{background:C.blueLight,color:C.blueMid,fontFamily:"monospace",fontWeight:700,fontSize:11,padding:"2px 8px",borderRadius:5}}>{p.prof} m</span>
                    </div>
                    <div style={{fontSize:11,color:C.text,marginBottom:2}}>{p.site}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:10,fontSize:10,color:C.gray}}>
                      <span>Tps total : <strong style={{color:C.text}}>{p.duree||"—"} min</strong></span>
                      <span>Tps fond : <strong style={{color:C.text}}>{p.tpsFond||"—"} min</strong></span>
                      <span>Gaz : <strong style={{color:C.text}}>{p.gaz||"—"}</strong></span>
                    </div>
                    <div style={{fontSize:10,color:C.gray,marginTop:2}}>Paliers : <strong style={{color:C.text,fontFamily:"monospace"}}>{formatPaliers(p)}</strong></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

                      <div style={{flex:1}}>
                        <div style={{fontWeight:500}}>{p.site}</div>
                        <div style={{color:C.gray,fontSize:10,fontFamily:"monospace"}}>{p.date}{p.tpsFond?" · "+p.tpsFond+" min":""}</div>

        );
      })}
      {total>0&&(
        <div style={{display:"flex",gap:9,marginTop:4}}>
          <button style={{...s.btn("primary"),flex:1}} onClick={exportCSV}>📊 Export Excel / CSV</button>
        </div>
      )}
    </div>
  );
}

// ─── VUE CARNET PLONGÉE ──────────────────────────────────────────────────────
function VueCarnetPlongee({ docs }) {
  const [openDiver,setOpenDiver]=useState(null);
  const plongees=docs.filter(d=>d.type==="securite").flatMap(fiche=>{
    const data=fiche.data||{};
    return (data.operateurs||[]).flatMap(op=>{
      if(!op.equipe||!op.equipe.trim())return[];
      const prof=parseFloat(op.prof);
      if(isNaN(prof)||prof<=0)return[];
      return [{nom:op.equipe.trim(),date:data.date||fiche.date||"—",site:data.site||fiche.chantier||"—",prof,duree:op.duree||"",tpsFond:op.tpsFond||"",p12:op.p12||"",p9:op.p9||"",p6:op.p6||"",p3:op.p3||"",gaz:data.melange||"",methode:data.methode||""}];
    });
  });
  const byNom={};
  plongees.forEach(p=>{if(!byNom[p.nom])byNom[p.nom]=[];byNom[p.nom].push(p);});
  const divers=Object.keys(byNom).sort();
  const totalMin=(arr)=>arr.reduce((s,p)=>{const d=parseFloat(p.duree);return s+(isNaN(d)?0:d);},0);
  const fmtPaliers=(p)=>{const pts=[];if(p.p12)pts.push("12m:"+p.p12);if(p.p9)pts.push("9m:"+p.p9);if(p.p6)pts.push("6m:"+p.p6);if(p.p3)pts.push("3m:"+p.p3);return pts.length?pts.join(" · "):"—";};
  return (
    <div style={s.view}>
      <div style={s.infoBanner}><strong>📘 Carnet de plongée individuel</strong></div>
      {divers.length===0?(
        <div style={{textAlign:"center",padding:"36px 20px",color:C.gray}}>
          <div style={{fontSize:36,marginBottom:8}}>📘</div>
          <p style={{fontSize:13}}>Aucune plongée enregistrée.</p>
        </div>
      ):divers.map(nom=>{
        const arr=byNom[nom].slice().sort((a,b)=>b.date.localeCompare(a.date));
        const nb=arr.length,tMin=totalMin(arr),profMax=Math.max(...arr.map(p=>p.prof));
        const open=openDiver===nom;
        return (
          <div key={nom} style={{...s.card,marginBottom:10}}>
            <div onClick={()=>setOpenDiver(open?null:nom)} style={{padding:"12px 14px",cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontWeight:700,fontSize:14}}>🤿 {nom}</div>
                <div style={{color:C.blueMid,fontSize:13}}>{open?"▾":"▸"}</div>
              </div>
              <div style={{display:"flex",gap:14,fontSize:11,color:C.gray,marginTop:5}}>
                <span><strong style={{color:C.text,fontFamily:"monospace",fontSize:13}}>{nb}</strong> plongée{nb>1?"s":""}</span>
                <span>Total <strong style={{color:C.text,fontFamily:"monospace"}}>{tMin} min</strong></span>
                <span>Max <strong style={{color:C.text,fontFamily:"monospace"}}>{profMax} m</strong></span>
              </div>
            </div>
            {open&&(
              <div style={{borderTop:"1px solid "+C.grayLight,padding:"4px 14px 10px"}}>
                {arr.map((p,i)=>(
                  <div key={i} style={{padding:"8px 0",borderBottom:i<arr.length-1?"1px solid "+C.grayLight:"none"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                      <span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:C.blue}}>{p.date}</span>
                      <span style={{background:C.blueLight,color:C.blueMid,fontFamily:"monospace",fontWeight:700,fontSize:11,padding:"2px 8px",borderRadius:5}}>{p.prof} m</span>
                    </div>
                    <div style={{fontSize:11,color:C.text,marginBottom:2}}>{p.site}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:10,fontSize:10,color:C.gray}}>
                      <span>Total : <strong style={{color:C.text}}>{p.duree||"—"} min</strong></span>
                      <span>Fond : <strong style={{color:C.text}}>{p.tpsFond||"—"} min</strong></span>
                      <span>Gaz : <strong style={{color:C.text}}>{p.gaz||"—"}</strong></span>
                    </div>
                    <div style={{fontSize:10,color:C.gray,marginTop:2}}>Paliers : <strong style={{color:C.text,fontFamily:"monospace"}}>{fmtPaliers(p)}</strong></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── APP PRINCIPALE ───────────────────────────────────────────────────────────
function App() {
  useEffect(()=>{
    if(window.XLSX_LIB)return;
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload=()=>{window.XLSX_LIB=window.XLSX;};
    document.head.appendChild(sc);
  },[]);

  const [tab,setTab]=useState("securite");
  const [securite,setSecurite]=useState(emptySecurite);
  const [notice,setNotice]=useState(emptyNotice);
  const [accueil,setAccueil]=useState(emptyAccueil);
  const [docs,setDocs]=useState(()=>loadDocs());
  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState(null);
  const [toast,setToast]=useState("");
  const [editingDocId,setEditingDocId]=useState(null);

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

  const fetchDocs=async()=>{
    if(!supabaseReady()){const l=loadDocs();if(l.length>0)setDocs(l);return;}
    try{
      setSyncing(true);
      const res=await sbFetch("/documents?order=saved_at.desc&limit=500&select=*");
      if(!res.ok){const l=loadDocs();if(l.length>0)setDocs(l);return;}
      const rows=await res.json();
      if(!Array.isArray(rows)){const l=loadDocs();if(l.length>0)setDocs(l);return;}
      const remote=rows.filter(r=>r&&(r.payload||r.type)).map(r=>{const b=r.payload||r;return{...b,id:r.id||b.id,savedAt:r.saved_at||b.savedAt};});
      const local=loadDocs();
      const rIds=new Set(remote.map(d=>String(d.id)));
      const merged=[...remote,...local.filter(d=>!rIds.has(String(d.id)))];
      setDocs(merged);saveDocs(merged);setLastSync(new Date());
    }catch(e){console.error("Sync:",e);const l=loadDocs();if(l.length>0)setDocs(l);}
    finally{setSyncing(false);}
  };

  useEffect(()=>{fetchDocs();const iv=setInterval(fetchDocs,8000);return()=>clearInterval(iv);},[]);

  useEffect(()=>{
    const fc=()=>{
      if(!supabaseReady())return;
      sbFetch("/chantiers?order=nom.asc&limit=200").then(r=>r.ok?r.json():[]).then(rows=>{
        if(Array.isArray(rows)&&rows.length>0){
          const noms=rows.map(r=>r.nom).filter(Boolean);
          setChantiers(prev=>{const m=[...new Set([...prev,...noms])];localStorage.setItem("bonna_chantiers",JSON.stringify(m));return m;});
        }
      }).catch(()=>{});
    };
    fc();const iv=setInterval(fc,30000);return()=>clearInterval(iv);
  },[]);

  const saveDoc=async(type,data)=>{
    const labels={securite:"Fiche Sécurité",notice:"Notice Poste Hyperbare",accueil:"Accueil QSE Renforcé"};
    const nd={id:Date.now(),type,label:labels[type],chantier:data.site||data.chantier||"—",date:data.date||data.dateArrivee||new Date().toISOString().slice(0,10),nom:data.nom?(data.nom+" "+(data.prenom||"")).trim():"",data,savedAt:new Date().toISOString()};
    if(supabaseReady()){
      try{await sbFetch("/documents",{method:"POST",prefer:"return=minimal",body:JSON.stringify({id:nd.id,type:nd.type,chantier:nd.chantier,date:nd.date,nom:nd.nom,saved_at:nd.savedAt,payload:nd})});await fetchDocs();showToast("✓ Sauvegardé et synchronisé");}
      catch(e){console.error("Save:",e);const u=[...docs,nd];saveDocs(u);setDocs(u);showToast("✓ Sauvegardé localement");}
    }else{const u=[...docs,nd];saveDocs(u);setDocs(u);showToast("✓ Sauvegardé");}
  };

  const updateDoc=async(type,data)=>{
    if(!editingDocId)return;
    const labels={securite:"Fiche Sécurité",notice:"Notice Poste Hyperbare",accueil:"Accueil QSE Renforcé"};
    const ud={id:editingDocId,type,label:labels[type],chantier:data.site||data.chantier||"—",date:data.date||data.dateArrivee||new Date().toISOString().slice(0,10),nom:data.nom?(data.nom+" "+(data.prenom||"")).trim():"",data,savedAt:new Date().toISOString()};
    if(supabaseReady()){
      try{await sbFetch("/documents?id=eq."+editingDocId,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify({chantier:ud.chantier,date:ud.date,nom:ud.nom,saved_at:ud.savedAt,payload:ud})});await fetchDocs();showToast("✓ Modifié et synchronisé");}
      catch(e){const u=docs.map(d=>d.id===editingDocId?ud:d);saveDocs(u);setDocs(u);showToast("✓ Modifié");}
    }else{const u=docs.map(d=>d.id===editingDocId?ud:d);saveDocs(u);setDocs(u);showToast("✓ Modifié");}
    setEditingDocId(null);
  };

  const deleteDoc=async(id)=>{
    const u=docs.filter(d=>String(d.id)!==String(id));saveDocs(u);setDocs(u);showToast("Document supprimé");
    if(supabaseReady()){
      try{await sbFetch("/documents?id=eq."+id,{method:"DELETE"});setTimeout(fetchDocs,500);}
      catch(e){console.error("Delete:",e);}
    }
  };

  const editDoc=(doc)=>{
    if(doc.type==="securite")setSecurite({...emptySecurite(),...doc.data,operateurs:(doc.data.operateurs||[]).map(op=>({...emptyOp(),...op}))});
    if(doc.type==="notice")setNotice({...emptyNotice(),...doc.data});
    if(doc.type==="accueil")setAccueil({...emptyAccueil(),...doc.data});
    setEditingDocId(doc.id);setTab(doc.type);
    showToast("Formulaire chargé — modifiez puis cliquez Modifier");
  };

  const genPDF=async(type,data)=>{
    const date=new Date().toLocaleDateString("fr-FR");
    const css="body{font-family:Arial,sans-serif;font-size:11px;padding:15px;margin:0}h1{font-size:14px;text-align:center;border-bottom:2px solid #1a3a6e;padding-bottom:5px;color:#1a3a6e;margin-bottom:8px}h2{font-size:11px;background:#1a3a6e;color:#fff;padding:5px 9px;margin:10px 0 5px}table{width:100%;border-collapse:collapse;margin-bottom:9px}th{background:#e8eef8;font-size:9px;padding:4px 6px;border:1px solid #ccc;text-align:left}td{border:1px solid #ccc;padding:4px 6px;font-size:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f{display:flex;margin-bottom:4px;gap:6px;font-size:11px}.f b{min-width:130px;flex-shrink:0}.f span{border-bottom:1px solid #bbb;flex:1;padding-left:3px}.logo{display:flex;align-items:center;gap:9px;margin-bottom:8px}.logo-box{background:#e85d1a;color:#fff;font-weight:bold;padding:3px 9px;font-size:12px}.note{background:#e8eef8;border-left:3px solid #2356a8;padding:6px 9px;font-size:10px;margin-top:8px}.page-break{page-break-before:always}.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-bottom:6px}.chk{font-size:9px;line-height:1.4}.risk-illustration{width:100%;display:block;border:1px solid #ccc;margin:6px 0 10px}@media print{@page{margin:10mm}}";

    showToast("✓ PDF téléchargé");
  };

  const tabs=[{id:"securite",num:"FO-SEC",label:"Fiche Sécurité"},{id:"notice",num:"035_QSE",label:"Notice Poste"},{id:"accueil",num:"043_QSE",label:"Accueil QSE"},{id:"archive",num:"ARCHIVE",label:"Documents"},{id:"penibilite",num:"C2P",label:"Pénibilité"},{id:"carnet",num:"CARNET",label:"Carnet Plongée"}];

  return (
    <div style={s.app}>
      <div style={s.header}>
        <div style={s.logoRow}>
          <span style={s.logoBox}>BONNA TP</span>
          <span style={s.appTitle}>Formulaires Terrain</span>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={s.appSub}>Gestion sécurité hyperbare</div>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            {syncing?(<span style={{fontSize:9,color:"rgba(255,255,255,0.6)",fontFamily:"monospace"}}>↻ sync…</span>)
            :lastSync?(<span style={{fontSize:9,color:"rgba(255,255,255,0.4)",fontFamily:"monospace",cursor:"pointer"}} onClick={fetchDocs}>✓ {lastSync.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span>)
            :null}
          </div>
        </div>
      </div>
      <div style={s.tabBar}>
        {tabs.map(t=>(
          <button key={t.id} style={s.tabBtn(tab===t.id)} onClick={()=>setTab(t.id)}>
            <span style={s.tabNum(tab===t.id)}>{t.num}</span>{t.label}
          </button>
        ))}
      </div>
      {tab==="securite"&&<VueSecurite data={securite} setData={setSecurite} onSave={()=>saveDoc("securite",securite)} onUpdate={()=>updateDoc("securite",securite)} onExportPDF={()=>genPDF("securite",securite)} editingDocId={editingDocId} onClear={()=>{setSecurite(emptySecurite());setEditingDocId(null);}}/>}
      {tab==="notice"&&<VueNotice data={notice} setData={setNotice} onSave={()=>saveDoc("notice",notice)} onUpdate={()=>updateDoc("notice",notice)} onExportPDF={()=>genPDF("notice",notice)} editingDocId={editingDocId} onClear={()=>{setNotice(emptyNotice());setEditingDocId(null);}}/>}
      {tab==="accueil"&&<VueAccueil data={accueil} setData={setAccueil} onSave={()=>saveDoc("accueil",accueil)} onUpdate={()=>updateDoc("accueil",accueil)} onExportPDF={()=>genPDF("accueil",accueil)} editingDocId={editingDocId} onClear={()=>{setAccueil(emptyAccueil());setEditingDocId(null);}}/>}
      {tab==="archive"&&<VueArchive docs={docs} onDelete={deleteDoc} onEdit={editDoc} onExportPDF={(doc)=>genPDF(doc.type,doc.data)}/>}
      {tab==="penibilite"&&<VuePenibilite docs={docs}/>}
      {tab==="carnet"&&<VueCarnetPlongee docs={docs}/>}
      <Toast message={toast}/>
    </div>
  );
}
// Monter l'app immédiatement, config Supabase chargée en arrière-plan
function mountApp() {
  try {
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
    const loader = document.getElementById("loading");
    if (loader) loader.style.display = "none";
  } catch(e) {
    const loader = document.getElementById("loading");
    if (loader) loader.innerHTML = '<div style="padding:20px;color:#fff;font-family:monospace;font-size:11px"><b>Erreur:</b><br>' + e.message + '</div>';
    console.error("App mount error:", e);
  }
}

// Essayer de charger la config d'abord, avec timeout de 2s
const configTimeout = setTimeout(() => mountApp(), 2000);
window.__ENV_PROMISE__.then(() => {
  clearTimeout(configTimeout);
  mountApp();
}).catch(() => {
  clearTimeout(configTimeout);
  mountApp();
});



</script>

</body>
</html>
